name: Build macOS Apple Silicon Beta

on:
  push:
    branches:
      - macos_preview_migration
  workflow_dispatch:
    inputs:
      beta:
        description: Build friend-beta edition (activation code + Sui-xiang GPT Pro only)
        type: boolean
        required: true
        default: true

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (arm64)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: arm64

      - name: Verify Apple Silicon runner architecture
        run: |
          uname -a
          test "$(uname -m)" = "arm64"
          node -p "process.platform + '/' + process.arch"

      - name: Set up Flutter (arm64)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: arm64
          cache: true

      - name: Install core dependencies & typecheck
        working-directory: core
        run: |
          npm install --no-audit --no-fund
          npm run typecheck

      - name: Run macOS port & Seatbelt unit tests
        working-directory: core
        env:
          DREAMFLUTTER_TEST_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: |
          node --experimental-strip-types --test \
            test/macos-port.test.ts \
            test/seatbelt-sandbox.test.ts

      - name: Run cross-platform core tests
        working-directory: core
        env:
          DREAMFLUTTER_TEST_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: |
          node --experimental-strip-types --test \
            test/backup.test.ts \
            test/storage-target.test.ts \
            test/system-proxy.test.ts \
            test/toolchain.test.ts \
            test/security-primitives.test.ts \
            test/security-boundaries.test.ts

      - name: Run live macOS Seatbelt selfTest
        working-directory: core
        run: |
          node --experimental-strip-types --input-type=module -e '
            import { mkdtempSync, rmSync } from "node:fs";
            import { join } from "node:path";
            import { tmpdir } from "node:os";
            import { buildCore } from "./src/app.ts";
            import { Logger } from "./src/log.ts";
            import { RecordingNotifier } from "./src/notify.ts";
            import { corePaths, defaultAgentDir } from "./src/paths.ts";
            import { MacSeatbeltSandbox } from "./src/sandbox/seatbelt.ts";
            const dir = mkdtempSync(join(tmpdir(), "df-ci-seatbelt-"));
            const core = buildCore({
              paths: corePaths(dir),
              agentDir: defaultAgentDir(dir),
              log: new Logger(),
              notifier: new RecordingNotifier(),
            });
            try {
              await core.start();
              const sb = core.module(MacSeatbeltSandbox);
              if (!sb) throw new Error("MacSeatbeltSandbox module not registered");
              for (const online of [true, false]) {
                core.settings.update({ sandboxOnline: online });
                const items = await sb.selfTest();
                console.log(JSON.stringify({ online, items }, null, 2));
                if (!items.length || items.some(i => !i.passed)) {
                  throw new Error(`Seatbelt live selfTest failed (online=${online})`);
                }
              }
            } finally {
              await core.shutdown();
              rmSync(dir, { recursive: true, force: true });
            }
          '

      - name: Test packages/pi_rpc
        working-directory: packages/pi_rpc
        run: |
          flutter pub get
          flutter test test/macos_locator_test.dart test/client_test.dart

      - name: Analyze & test app
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test test/beta_edition_test.dart --dart-define=DREAMFLUTTER_BETA=true

      - name: Package macOS Apple Silicon .dmg
        run: |
          if [ "${{ inputs.beta }}" != "false" ]; then
            bash scripts/package-macos.sh --beta
          else
            bash scripts/package-macos.sh
          fi

      - name: Verify packaged .app bundle
        run: |
          RES="dist/macos/DreamFlutter.app/Contents/Resources"
          if [ "${{ inputs.beta }}" != "false" ]; then
            test -f "$RES/beta-edition.json"
          fi
          test ! -e "$RES/core/bin/voice/model.int8.onnx"
          test -f "$RES/core/bin/voice/tokens.txt"
          test -f "$RES/core/bin/voice/silero_vad.onnx"
          test -d "$RES/core/node_modules/sherpa-onnx-darwin-arm64"
          "$RES/runtime/bin/node" --version
          "$RES/core/bin/rg" --version
          "$RES/core/bin/uv" --version

      - name: Capture real macOS window UI screenshots
        working-directory: app
        run: |
          SHOT_DIR="$GITHUB_WORKSPACE/dist/macos/screenshots"
          mkdir -p "$SHOT_DIR"
          flutter test integration_test/macos_beta_look_test.dart -d macos \
            --dart-define=DREAMFLUTTER_BETA=true \
            --dart-define="MACOS_SHOT_DIR=$SHOT_DIR"

      - name: Smoke-launch packaged DreamFlutter.app & build screenshot gallery
        run: |
          SHOT_DIR="dist/macos/screenshots"
          mkdir -p "$SHOT_DIR"
          SMOKE_DATA="$(mktemp -d)"
          DREAMFLUTTER_DATA="$SMOKE_DATA" dist/macos/DreamFlutter.app/Contents/MacOS/DreamFlutter >/dev/null 2>&1 &
          APP_PID=$!
          READY=false
          for i in $(seq 1 30); do
            if [ -f "$SMOKE_DATA/core.json" ]; then
              READY=true
              break
            fi
            sleep 1
          done
          if [ "$READY" != "true" ]; then
            echo "Packaged DreamFlutter.app did not write core.json within 30s"
            cat "$SMOKE_DATA/core.log" || true
            kill "$APP_PID" || true
            rm -rf "$SMOKE_DATA"
            exit 1
          fi
          sleep 3
          /usr/sbin/screencapture -x "$SHOT_DIR/00-packaged-app-desktop.png" || true
          CORE_PID="$(node -e 'try{console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).pid||"")}catch{}' "$SMOKE_DATA/core.json")"
          kill "$APP_PID" || true
          if [ -n "$CORE_PID" ]; then
            kill "$CORE_PID" || true
          fi
          rm -rf "$SMOKE_DATA"

          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = process.argv[1];
            const files = fs.readdirSync(dir).filter(f => f.endsWith(".png")).sort();
            const cards = files.map(f => `<div class="card"><h3>${f}</h3><img src="${f}" alt="${f}"></div>`).join("\n");
            fs.writeFileSync(path.join(dir, "index.html"), `<!doctype html><html><meta charset="utf-8"><title>DreamFlutter macOS Beta Screenshots</title><style>body{font-family:system-ui;background:#f7f4ee;color:#2c2924;margin:24px}h1{margin-bottom:16px}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:24px;box-shadow:0 2px 12px rgba(0,0,0,.08)}img{max-width:100%;height:auto;border-radius:8px;border:1px solid #e5dfd5}</style><h1>DreamFlutter 1.0 Beta (macOS Apple Silicon)</h1>\n${cards}\n</html>`);
          ' "$SHOT_DIR"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: DreamFlutter-macos-arm64-beta
          path: |
            dist/macos/*.dmg
            dist/macos/SHA256SUMS
          if-no-files-found: error

      - name: Upload macOS screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DreamFlutter-macos-screenshots
          path: dist/macos/screenshots/
          if-no-files-found: warn
