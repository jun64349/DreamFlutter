# Vendored from desktop_drop 0.8.4 (Apache-2.0, MixinNetwork/flutter-plugins).
# DreamFlutter change: on Windows, drops that carry no file paths (images
# dragged out of browsers and chat apps: virtual files, bitmaps) are saved to
# temporary files so the Dart side still receives paths. See README.dreamflutter.md.
name: desktop_drop
description: A plugin which allows user dragging files to your flutter desktop applications.
version: 0.8.4+df1
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.0.0"

dependencies:
  dbus: ^0.7.10
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cross_file: ^0.3.4+2
  web: ^1.1.1
  universal_platform: ^1.1.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: DesktopDropPlugin
      web:
        pluginClass: DesktopDropWeb
        fileName: desktop_drop_web.dart
