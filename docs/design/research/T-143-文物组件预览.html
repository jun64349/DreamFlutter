<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>梦蝶 · 文物线描与组件提案</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f7f3eb; --ink: #392f2a; --ink2: #5a4e45; --accent: #a54c28;
    --line: #e4dcd0; --card: #fdfbf7; --chip: #f0eae0; --on: #fffdf9; --danger: #a8332a;
    --selected: color-mix(in srgb,var(--accent) 13%,var(--card));
    --hover: color-mix(in srgb,var(--ink) 8%,var(--card));
    --sans: "Noto Sans SC","Microsoft YaHei UI",sans-serif;
    --serif: "Noto Serif SC","Songti SC",SimSun,serif;
    --press: .12s cubic-bezier(.2,.75,.25,1);
    font: 15px/1.65 var(--sans);
    color: var(--ink);
    background: var(--paper);
  }
  :root[data-dark="true"] { color-scheme: dark; --danger: #e07a6c }
  * { box-sizing: border-box }
  body { margin: 0 }
  main { width: min(1120px,100%); margin: 0 auto; padding: 0 clamp(20px,5vw,65px) 64px }
  h1,h2,h3,p { margin: 0 }
  h1,h2,h3 { font-family: var(--serif); line-height: 1.25 }
  h1 { font-size: clamp(30px,7vw,60px); font-weight: 650; letter-spacing: .025em }
  h2 { font-size: clamp(22px,3vw,29px) }
  h3 { font-size: 18px }
  p { text-wrap: pretty }
  a { color: var(--ink); text-underline-offset: .24em }
  button, select, input { font: inherit }
  button, select { color: inherit }
  button { cursor: pointer }
  button:disabled { cursor: default }
  em { font-style: normal }
  .brand { display: flex; align-items: center; gap: 8px; font: 650 17px var(--serif) }
  .brand img { width: 25px; height: 25px }
  .mast { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 20px 0; border-bottom: 1px solid var(--line) }
  .mast a { font-size: 13px }
  .intro { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(240px,1fr); gap: 26px 60px; align-items: end; padding: clamp(30px,7vw,68px) 0 31px }
  .intro p { font-size: 16px; color: var(--ink2) }
  .controls { display: flex; align-items: center; gap: 16px 26px; flex-wrap: wrap; padding: 17px 0; border-block: 1px solid var(--line) }
  .controls label { display: inline-flex; gap: 8px; align-items: center }
  .controls select,.grammar-controls select { max-width: min(180px, 55vw); padding: 5px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); min-height: 35px }
  input { accent-color: var(--accent) }
  .section { margin-top: 37px }
  .section > h2 { margin-bottom: 12px }
  .grammar-controls { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0 0 15px; color: var(--ink2); font-size: 13px }
  .grammar-controls label { display: inline-flex; align-items: center; gap: 6px; min-height: 26px }
  .grammars { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px }
  .grammar { border: 1px solid var(--material-edge); color: var(--material-ink); padding: 17px clamp(9px,2vw,25px) 15px; background: var(--material-paper); display: grid; align-content: start; gap: 8px; min-width: 0 }
  .grammar h3 { width: fit-content }
  .grammar p { font-size: 12px }
  .grammar a { color: inherit; font-size: 12px; width: fit-content }
  .grammar-song {
    --material-paper: #edf1ea; --material-ink: #243831; --material-edge: #9daea3;
    --material-button: #f7f8f1; --material-hover: #e6ede4; --material-on: #cbded2; --material-marker: #315f4a;
    border-radius: 17px;
    background-image: repeating-radial-gradient(ellipse at 100% 0%,transparent 0 21px,#5d756610 22px 23px,transparent 24px 35px);
    background-position: right top; background-size: 88px 41px; background-repeat: no-repeat;
  }
  .grammar-wood {
    --material-paper: #eee5d7; --material-ink: #493425; --material-edge: #af997f;
    --material-button: #f7efe1; --material-hover: #ebdbc6; --material-on: #e2c8a8; --material-marker: #794621;
    border-radius: 2px;
    background-image: linear-gradient(135deg,transparent 47%,#76573826 48% 49%,transparent 50%),repeating-linear-gradient(0deg,transparent 0 7px,#76573817 8px 9px,transparent 10px 13px);
    background-position: right top; background-size: 88px 41px; background-repeat: no-repeat;
  }
  .grammars[data-mono="true"] .grammar {
    --material-paper: #f7f3eb; --material-ink: #392f2a; --material-edge: #aaa8a0;
    --material-button: #fffdf9; --material-hover: #f0eeea; --material-on: #dddcd8; --material-marker: #3d3b37;
    background-image: none;
  }
  .grammar-actions { display:grid; grid-template-columns: repeat(4,minmax(0,1fr)); row-gap: 12px; margin-top: 7px }
  .grammar-action { display:grid; justify-items: center; align-items: start; gap: 4px; min-width: 0 }
  .grammar-action small { font-size: 11px; white-space: nowrap }
  .grammar-button {
    width: 34px; height: 34px; display: grid; place-items:center; padding: 0; border: 0;
    background: transparent; color: inherit; border-radius: 8px;
    transition: transform var(--press);
  }
  .grammar-button:active { transform: translateY(1px) scale(.975) }
  .grammar-button:focus-visible { outline-color: var(--material-marker) }
  .grammar-shape {
    position:relative; width: 100%; height: 100%; display:grid; place-items:center; isolation:isolate;
    background: var(--material-edge);
  }
  .grammar-shape::before {
    content: ""; position:absolute; inset:1px; z-index:-1;
    background: var(--material-button);
    transition: background-color var(--press);
  }
  .grammar-button:hover .grammar-shape::before { background-color: var(--material-hover) }
  .grammar-button[aria-pressed="true"] .grammar-shape::before { background-color: var(--material-on) }
  .grammar-button[aria-pressed="true"] .grammar-shape { background: var(--material-marker) }
  .grammar-shape::after { content: ""; position:absolute; width: 10px; bottom: 2px; left: calc(50% - 5px); opacity:.36; pointer-events:none }
  .grammar-button:hover .grammar-shape::after { opacity:.7 }
  .grammar-button[aria-pressed="true"] .grammar-shape::after { opacity:1 }
  .grammar-song .grammar-shape, .grammar-song .grammar-shape::before { border-radius: 10px 10px 8px 8px }
  .grammar-song .grammar-shape::after { height: 4px; border-bottom: 1px solid var(--material-marker); border-radius: 0 0 55% 55% }
  .grammar-wood .grammar-shape, .grammar-wood .grammar-shape::before { clip-path: polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px) }
  .grammar-wood .grammar-shape::before { background-image: linear-gradient(45deg,transparent 0 46%,var(--material-edge) 48% 54%,transparent 56%); background-size: 5px 5px; background-position: right top; background-repeat: no-repeat }
  .grammar-wood .grammar-shape::after { height: 1px; background: var(--material-marker) }
  .grammar .glyph { width: 24px; height: 24px }
  .grammar-wood .glyph { stroke-linejoin: bevel; stroke-linecap: butt }
  .grammar-button[data-pair="stop"] .glyph { fill: currentColor; stroke: none }
  .grammars[data-small="true"] .glyph { width: 16px; height: 16px }
  [data-motion="off"] .grammar-button:active { transform: none }
  @media (prefers-reduced-motion: reduce) { .grammar-button:active { transform: none } }
  @media (max-width: 430px) {
    .grammar { padding-inline: 8px }
    .grammar-actions { grid-template-columns: repeat(2,minmax(0,1fr)) }
  }
  .sample { display: grid; grid-template-columns: minmax(240px, 1fr) minmax(0, 1.85fr); border: 1px solid var(--line); background: var(--card); border-radius: 12px; overflow: hidden }
  .object { display: grid; gap: 8px; align-content: center; padding: 22px clamp(17px,3.7vw,38px); background: var(--selected) }
  .object .motif { color: var(--accent); height: 77px; width: 77px; margin: 0 0 8px }
  .object p { color: var(--ink2); font-size: 13px }
  .object a { font-size: 13px; width: fit-content }
  .component { display: grid; align-content: center; padding: 20px clamp(14px,3vw,31px) }
  .component .strip { display: flex; min-height: 50px; align-items: center; gap: 5px 11px; flex-wrap: wrap }
  .component .strip + .strip { border-top: 1px solid var(--line) }
  .component .control-title { margin-inline-end: 6px; color: var(--ink2); font-size: 13px }
  svg.glyph, svg.motif { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round }
  svg.glyph { width: 16px; height: 16px; flex: 0 0 16px }
  .button { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink); padding: 6px 13px; border: 1px solid transparent; box-shadow: none; background: var(--hover); min-height: 34px; border-radius: 8px; touch-action: manipulation; transition: background-color var(--press),color var(--press),transform var(--press) }
  .button:hover:not(:disabled, [aria-disabled="true"]), .state-hover { background: color-mix(in srgb,var(--ink) 13%,var(--card)) }
  .button:active:not(:disabled,[aria-disabled="true"]), .state-pressed { background: color-mix(in srgb,var(--ink) 21%,var(--card)); transform: translateY(1px) scale(.975) }
  .button.primary { background: var(--accent); color: var(--on); border-color: var(--accent) }
  .button.primary:hover:not([aria-disabled="true"]) { background: color-mix(in srgb,var(--accent) 89%,var(--ink)) }
  .button.primary:active:not([aria-disabled="true"]) { background: color-mix(in srgb,var(--accent) 78%,var(--ink)) }
  .button.ghost { background: transparent; border-color: var(--line) }
  .button.danger { background: transparent; border-color: var(--danger); color: var(--danger) }
  .button.icon { background: transparent; width: 30px; min-height: 30px; padding: 0 }
  .button.icon:hover:not(:disabled), .button.icon[aria-pressed="true"] { background: var(--selected) }
  .button[aria-pressed="true"] { background: var(--selected); box-shadow: inset 0 -2px var(--accent) }
  :focus-visible, .state-focus { outline: 2px solid var(--accent); outline-offset: 2px }
  .button:disabled { opacity: .48 }
  .button[aria-disabled="true"] { cursor: progress }
  .button.busy { min-width: 100px }
  .button.busy[aria-busy="true"] .glyph, .state-busy .glyph { animation: turn .9s linear infinite }
  .button.busy[aria-busy="true"] { opacity: .85 }
  @keyframes turn { to { transform: rotate(360deg) } }
  [data-theme="liuguang"] .button.primary:hover { box-shadow: inset 0 1px color-mix(in srgb,var(--on) 30%,white) }
  [data-theme="youhua"] .button:hover { box-shadow: inset 0 1px color-mix(in srgb,var(--ink) 25%,transparent) }
  .switch { width: 38px; height: 22px; border: 1px solid var(--ink2); border-radius: 999px; padding: 0; background: var(--hover); position: relative }
  .switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent) }
  .switch::after { content: ""; display: block; position: absolute; width: 12px; height: 12px; inset: 4px auto auto 4px; border-radius: 50%; background: var(--ink2); transition: transform var(--press) }
  .switch[aria-checked="true"]::after { transform: translateX(16px); background: var(--on) }
  [data-theme="shiqing"] .switch::after { border-radius: 2px; clip-path: polygon(50% 0,100% 50%,50% 100%,0 50%) }
  [data-theme="yuhua"] .switch::after { border-radius: 2px }
  .range { width: min(112px,45vw); margin: 0 2px; min-height: 22px }
  [data-theme="yuhua"] .range { appearance: none; background: repeating-linear-gradient(90deg,var(--accent) 0 1px,transparent 1px 13px) center 15px/100% 4px no-repeat }
  [data-theme="yuhua"] .range::-webkit-slider-runnable-track { height: 2px; background: var(--accent) }
  [data-theme="yuhua"] .range::-webkit-slider-thumb { appearance: none; width: 9px; height: 13px; border-radius: 2px; margin-top: -5px; background: var(--accent) }
  [data-theme="yuhua"] .range::-moz-range-track { height: 2px; background: var(--accent) }
  [data-theme="yuhua"] .range::-moz-range-thumb { width: 9px; height: 13px; border-radius: 2px; background: var(--accent) }
  [data-theme="shiqing"] .range { appearance: none }
  [data-theme="shiqing"] .range::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--ink2) }
  [data-theme="shiqing"] .range::-webkit-slider-thumb { appearance: none; width: 15px; height: 15px; margin-top: -6px; background: var(--accent); clip-path: polygon(50% 0,100% 50%,50% 100%,0 50%) }
  [data-theme="shiqing"] .range::-moz-range-track { height: 3px; border-radius: 2px; background: var(--ink2) }
  [data-theme="shiqing"] .range::-moz-range-thumb { width: 15px; height: 15px; border: 0; background: var(--accent); clip-path: polygon(50% 0,100% 50%,50% 100%,0 50%) }
  .feedback { color: var(--ink2); font-size: 13px; min-height: 1.7em; margin-top: 3px }
  .state-grid { display: grid; gap: 1px; grid-template-columns: repeat(auto-fit,minmax(118px,1fr)); background: var(--line); border: 1px solid var(--line); border-radius: 9px; overflow: hidden }
  .state-grid figure { margin: 0; text-align: center; padding: 18px 6px 12px; display: grid; justify-items: center; gap: 8px; background: var(--card) }
  figcaption { font-size: 13px; color: var(--ink2) }
  .sample-only { pointer-events: none; user-select: none }
  .state-selected { background: var(--selected); box-shadow: inset 0 -2px var(--accent) }
  .state-disabled { opacity: .48 }
  .candidates { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,325px),1fr)); gap: 0 26px; border-top: 1px solid var(--line) }
  .candidate { display: grid; grid-template-columns: minmax(0,1fr) 33px 33px; column-gap: 9px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line) }
  .candidate p,.candidate small { font-size: 12px; color: var(--ink2) }
  .candidate strong { font-weight: 650 }
  .candidate .drawing { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: var(--card); justify-self: end }
  .candidate .proposal { color: var(--accent); background: var(--selected) }
  .candidate-key { display: flex; gap: 12px; flex-wrap: wrap; margin: 0 0 10px; font-size: 13px; color: var(--ink2) }
  .catalog { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,240px),1fr)); gap: 0 29px; border-top: 1px solid var(--line) }
  .catalog article { padding: 16px 0; min-width: 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 43px minmax(0,1fr); gap: 13px }
  .catalog .motif { width: 36px; height: 36px; color: var(--accent) }
  .catalog p { font-size: 12px; color: var(--ink2); margin-top: 4px }
  footer { margin-top: 32px; color: var(--ink2); font-size: 13px }
  [data-motion="off"] *,[data-motion="off"] *::before,[data-motion="off"] *::after { transition: none !important; animation: none !important }
  [data-motion="off"] .button:active,[data-motion="off"] .state-pressed { transform: none }
  @media (prefers-reduced-motion: reduce) {
    *,*::before,*::after { transition: none !important; animation: none !important }
    .button:active,.state-pressed { transform: none }
  }
  @media(max-width:680px) { .intro,.sample { grid-template-columns: 1fr } .intro { gap: 12px } .object { grid-template-columns: 62px minmax(0,1fr); align-items: center } .object .motif { width: 54px; height: 54px; grid-row: span 3; margin: 0 } }
</style>

      '<path d="M5.5 4h13l1.5 1.5v13L18.5 20h-13L4 18.5v-13Z"/>'],
  ];
  const el = id => document.getElementById(id);
  const draw = (name, content) => `<svg class="${name}" viewBox="0 0 24 24" aria-hidden="true">${content}</svg>`;
  const icon = name => draw('glyph', iconPaths[name]);
  const motif = key => draw('motif', `<path d="${motifs[key][3]}"/>`);
  for (const [side, pathIndex] of [['song',2],['wood',3]]) {
    el(side+'-icons').innerHTML = grammarIcons.map(item => {
      const [id,label] = item;
      return `<div class="grammar-action"><button type="button" class="grammar-button" aria-label="${label}" title="${label}" aria-pressed="${id === 'chat'}" data-pair="${id}">
        <span class="grammar-shape">${draw('glyph', item[pathIndex])}</span></button><small aria-hidden="true">${label}</small></div>`;
    }).join('');
  }
  const grammarBoard = el('grammars');
  grammarBoard.addEventListener('click', event => {
    const button = event.target.closest('[data-pair]');
    if (!button) return;
    grammarBoard.querySelectorAll('[data-pair]').forEach(control => {
      control.setAttribute('aria-pressed', control.dataset.pair === button.dataset.pair);
    });
  });
  el('grammar-mono').addEventListener('change', event => { grammarBoard.dataset.mono = event.target.checked; });
  el('grammar-small').addEventListener('change', event => { grammarBoard.dataset.small = event.target.checked; });
  el('themes').innerHTML = themes.map(([id, name]) => `<option value="${id}">${name}</option>`).join('');

    <button type="button" class="button icon" data-label="搜索" aria-label="搜索" title="搜索">${icon('search')}</button>

    <button type="button" id="incognito" class="button icon" aria-label="无痕" title="无痕" aria-pressed="false">${icon('eye')}</button>

  el('actions').innerHTML = `
    <button type="button" id="send" class="button primary">${icon('send')}发送</button>
    <button type="button" id="save" class="button busy">保存</button>
    <button type="button" class="button ghost" data-label="取消">取消</button>
    <button type="button" class="button" disabled>不可用</button>`;
  const states = [
    ['默认','button',icon('copy')+'复制'],
    ['悬停','button state-hover',icon('copy')+'复制'],
    ['按下','button state-pressed',icon('copy')+'复制'],
    ['键盘焦点','button state-focus',icon('copy')+'复制'],
    ['已选','button state-selected',icon('check')+'无痕'],
    ['禁用','button state-disabled',icon('copy')+'复制'],
    ['处理中','button state-busy',icon('busy')+'保存中'],
  ];
  el('state-grid').innerHTML = states.map(([label, classes, body]) =>
    `<figure><span class="${classes} sample-only" aria-hidden="true">${body}</span><figcaption>${label}</figcaption></figure>`
  ).join('');

    `<article class="candidate"><div><strong>${label}</strong><p>${cue}</p></div>
      <span class="drawing">${draw('glyph', original)}</span><span class="drawing proposal">${draw('glyph', proposed)}</span></article>`
  ).join('');
  el('catalog').innerHTML = Object.entries(motifs).map(([key,[name, detail,url]]) => {

    return `<article>${motif(key)}<div><h3>${themeNames}</h3><p>${detail}</p><p><a href="${url}">${name}</a></p></div></article>`;
  }).join('');
  function setTheme() {
    const [id, name, key, paper, ink, ink2, accent, line, card, on, dark = false] =
      themes.find(t => t[0] === el('themes').value);
    const root = document.documentElement;
    root.dataset.theme = id;
    root.dataset.dark = dark;
    for (const [k,v] of Object.entries({ paper, ink, ink2, accent, line, card, on })) root.style.setProperty('--'+k, v);
    const [title, detail, url] = motifs[key];
    el('object').innerHTML = `${motif(key)}<h3>${name} · ${title}</h3><p>${detail}</p><a href="${url}">打开馆藏</a>`;
  }
  const feedback = el('feedback');
  el('themes').addEventListener('change', setTheme);
  el('reduce').addEventListener('change', event => document.documentElement.dataset.motion = event.target.checked ? 'off' : 'on');
  document.querySelectorAll('[data-label]').forEach(button => {
    button.addEventListener('click', () => { feedback.textContent = '已触发演示 · ' + button.dataset.label; });
  });
  el('incognito').addEventListener('click', event => {
    const pressed = event.currentTarget.getAttribute('aria-pressed') === 'true';
    event.currentTarget.setAttribute('aria-pressed', !pressed);
    feedback.textContent = pressed ? '无痕已关闭' : '无痕已开启';
  });
  el('paper').addEventListener('click', event => {
    const enabled = event.currentTarget.getAttribute('aria-checked') === 'true';
    event.currentTarget.setAttribute('aria-checked', !enabled);
    el('strength').disabled = enabled;
    feedback.textContent = enabled ? '宣纸纹理已关闭' : '宣纸纹理已开启';
  });
  el('strength').addEventListener('input', event => { el('strength-value').value = event.target.value+'%'; });
  let generation;
  const send = el('send');
  function finishGeneration(message) {
    clearTimeout(generation);
    generation = undefined;
    send.classList.replace('danger','primary');
    send.innerHTML = icon('send') + '发送';
    feedback.textContent = message;
  }
  send.addEventListener('click', () => {
    if (generation !== undefined) {
      finishGeneration('已停止生成演示');
      return;
    }
    send.classList.replace('primary','danger');
    send.innerHTML = icon('stop') + '停止';
    feedback.textContent = '正在生成演示';
    generation = setTimeout(() => finishGeneration('生成演示完成'), 4200);
  });
  el('save').addEventListener('click', event => {
    const button = event.currentTarget;
    if (button.getAttribute('aria-busy') === 'true') return;
    button.setAttribute('aria-busy','true');
    button.setAttribute('aria-disabled','true');
    button.innerHTML = icon('busy') + '保存中';
    feedback.textContent = '正在保存';
    setTimeout(() => {
      button.removeAttribute('aria-busy');
      button.removeAttribute('aria-disabled');
      button.textContent = '保存';
      feedback.textContent = '保存演示完成';
    }, 1200);
  });
  setTheme();
