<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方案一 印</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A8332A}a:hover{color:#7E241D}
.lbl{font-size:12px;letter-spacing:1.6px;color:#6B6052}
.cap{font-size:12px;color:#6B6052;margin-top:8px;text-align:center}
</style>
</helmet>
<div style="width: 1280px; height: 900px; box-sizing: border-box; padding: 56px 64px; background: #F7F2E8; color: #2B2620; font-family: 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; gap: 44px;">

  <!-- 标志（原图）与组合标志 -->
  <div style="display: flex; gap: 64px; align-items: center;">
    <div><img src="/_blob/aeba5faaeb0ee860e8ac2cf2771b694f" alt="DreamFlutter 图标" style="width: 220px; height: 220px; display: block;"><div class="cap">应用图标（你给的原图，原样使用）</div></div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 18px; align-items: flex-start;">
      <div class="lbl">组合标志</div>
      <div style="display: flex; align-items: center; gap: 18px;">
        <img src="/_blob/aeba5faaeb0ee860e8ac2cf2771b694f" alt="" style="width: 76px; height: 76px; display: block;">
        <span style="font-family: 'Noto Serif SC', serif; font-size: 48px; font-weight: 600; letter-spacing: 1px;">DreamFlutter</span>
        <span style="width: 54px; height: 54px; background: #A8332A; border-radius: 4px; color: #F7F2E8; font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 20px; line-height: 21px; display: inline-flex; align-items: center; justify-content: center; writing-mode: vertical-rl; letter-spacing: 2px;">梦蝶</span>
      </div>
      <div style="font-family: 'Noto Serif SC', serif; font-size: 16px; color: #4A4238;">栩栩然胡蝶也</div>
    </div>
  </div>

  <!-- 各尺寸与托盘 -->
  <div>
    <div class="lbl" style="margin-bottom: 14px;">各尺寸（都是同一张原图缩小）</div>
    <div style="display: flex; align-items: flex-end; gap: 28px;">
      <div><img src="/_blob/aeba5faaeb0ee860e8ac2cf2771b694f" alt="" style="width: 128px; height: 128px; display: block;"><div class="cap">128</div></div>
      <div><img src="/_blob/aeba5faaeb0ee860e8ac2cf2771b694f" alt="" style="width: 64px; height: 64px; display: block;"><div class="cap">64</div></div>
      <div><img src="/_blob/aeba5faaeb0ee860e8ac2cf2771b694f" alt="" style="width: 48px; height: 48px; display: block;"><div class="cap">48</div></div>
      <div><img src="/_blob/aeba5faaeb0ee860e8ac2cf2771b694f" alt="" style="width: 32px; height: 32px; display: block;"><div class="cap">32</div></div>
      <div><img src="/_blob/aeba5faaeb0ee860e8ac2cf2771b694f" alt="" style="width: 24px; height: 24px; display: block;"><div class="cap">24</div></div>
      <div><img src="/_blob/aeba5faaeb0ee860e8ac2cf2771b694f" alt="" style="width: 16px; height: 16px; display: block;"><div class="cap">16</div></div>
      <div style="width: 1px; height: 120px; background: #D9CDB8; margin: 0 8px;"></div>
      <div>
        <div style="display: flex;">
          <div style="width: 180px; height: 44px; background: #F3F3F3; display: flex; align-items: center; justify-content: center; gap: 14px; border-radius: 6px 0 0 6px;">
            <img src="/_blob/aeba5faaeb0ee860e8ac2cf2771b694f" alt="" style="width: 20px; height: 20px; display: block;">
            <span style="width: 16px; height: 16px; border-radius: 3px; background: #C9C9C9;"></span>
            <span style="width: 16px; height: 16px; border-radius: 3px; background: #C9C9C9;"></span>
          </div>
          <div style="width: 180px; height: 44px; background: #202020; display: flex; align-items: center; justify-content: center; gap: 14px; border-radius: 0 6px 6px 0;">
            <img src="/_blob/aeba5faaeb0ee860e8ac2cf2771b694f" alt="" style="width: 20px; height: 20px; display: block;">
            <span style="width: 16px; height: 16px; border-radius: 3px; background: #4A4A4A;"></span>
            <span style="width: 16px; height: 16px; border-radius: 3px; background: #4A4A4A;"></span>
          </div>
        </div>
        <div class="cap">托盘：浅色 / 深色任务栏</div>
      </div>
    </div>
  </div>

  <!-- 颜色与窗口 -->
  <div style="display: flex; gap: 48px; align-items: flex-start;">
    <div>
      <div class="lbl" style="margin-bottom: 14px;">品牌色（取自原图，只用在标志、朱印、安装包）</div>
      <div style="display: flex; gap: 12px;">
        <div><div style="width: 88px; height: 56px; border-radius: 8px; background: #C96A4A;"></div><div class="cap">赭橙 #C96A4A</div></div>
        <div><div style="width: 88px; height: 56px; border-radius: 8px; background: #DDA27F;"></div><div class="cap">杏 #DDA27F</div></div>
        <div><div style="width: 88px; height: 56px; border-radius: 8px; background: #EEE7D8; border: 1px solid #D9CDB8; box-sizing: border-box;"></div><div class="cap">米 #EEE7D8</div></div>
        <div><div style="width: 88px; height: 56px; border-radius: 8px; background: #3B352D;"></div><div class="cap">墨 #3B352D</div></div>
        <div><div style="width: 88px; height: 56px; border-radius: 8px; background: #A8332A;"></div><div class="cap">朱印 #A8332A</div></div>
      </div>
    </div>
    <div style="flex: 1;">
      <div class="lbl" style="margin-bottom: 14px;">在窗口里</div>
      <div style="border: 1px solid #D9CDB8; border-radius: 10px; overflow: hidden;">
        <div style="height: 44px; background: #EFE7D5; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 13px; color: #6B6052;">
          <img src="/_blob/aeba5faaeb0ee860e8ac2cf2771b694f" alt="" style="width: 22px; height: 22px; display: block;">
          <span style="font-family: 'Noto Serif SC', serif; font-weight: 600; color: #2B2620; font-size: 14px;">DreamFlutter</span>
          <span>工作台 / 毕设论文 / 整理三份报告</span>
        </div>
        <div style="height: 92px; background: #F3ECDD; display: flex; align-items: center; justify-content: center; gap: 12px;">
          <span style="font-size: 13px; color: #6B6052;">界面的颜色仍跟你选的名画主题（蛱蝶的石绿、草间的草绿……）</span>
          <span style="width: 40px; height: 26px; border-radius: 6px; background: #3F6E5E;"></span>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
