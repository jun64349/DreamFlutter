<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>0.12 新增界面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
:root{
  --rail:#E8E0D3; --side:#F0EAE0; --bg:#F7F3EB; --card:#FDFBF7; --bubble:#EFE5D6;
  --ink:#392F2A; --ink2:#52463E; --muted:#70665E; --line:#DED6C9; --line2:rgba(57,47,42,.07);
  --accent:#A54C28; --on-accent:#FDFBF7; --accent-soft:#F0DFCF; --ok:#546C5D; --ok-soft:rgba(84,108,93,.12);
  --ochre:#B5793F; --seal:#A8332A; --code:#F1EADF; --shadow:0 10px 30px rgba(57,47,42,.13);
  --bf-line:#392F2A; --bf-core:#FDFBF7; --bf-wing:#C96A3F; --bf-glow:#F0DFCF;
  --art:"Ma Shan Zheng","KaiTi","STKaiti",serif; --serif:"Noto Serif SC","Songti SC","SimSun",serif; --sans:"Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,monospace; --mark:#2F6FB0;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --rail:#1D1A17; --side:#221F1C; --bg:#27231F; --card:#302A25; --bubble:#3A322B;
  --ink:#F0E5D6; --ink2:#DCCFBE; --muted:#B9AB9B; --line:#4C4238; --line2:rgba(240,229,214,.07);
  --accent:#E6A17A; --on-accent:#27231F; --accent-soft:#49352B; --ok:#9EAF92; --ok-soft:rgba(158,175,146,.14);
  --ochre:#D9A066; --seal:#E07A6C; --code:#1F1B18; --shadow:0 10px 30px rgba(0,0,0,.45);
  --bf-line:#FFFFFF; --bf-core:#302A25; --bf-wing:#E6A17A; --bf-glow:#49352B; --mark:#7FB2E5; color-scheme:dark}}
:root[data-theme="dark"]{
  --rail:#1D1A17; --side:#221F1C; --bg:#27231F; --card:#302A25; --bubble:#3A322B;
  --ink:#F0E5D6; --ink2:#DCCFBE; --muted:#B9AB9B; --line:#4C4238; --line2:rgba(240,229,214,.07);
  --accent:#E6A17A; --on-accent:#27231F; --accent-soft:#49352B; --ok:#9EAF92; --ok-soft:rgba(158,175,146,.14);
  --ochre:#D9A066; --seal:#E07A6C; --code:#1F1B18; --shadow:0 10px 30px rgba(0,0,0,.45);
  --bf-line:#FFFFFF; --bf-core:#302A25; --bf-wing:#E6A17A; --bf-glow:#49352B; --mark:#7FB2E5; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{width:26px;height:26px;display:inline-block}.logo svg{width:100%;height:100%}

/* demo bar (not part of the app) */
#demo{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#2B2621;color:#EDE3D3;font-size:12.5px}
#demo b{font-weight:600;margin-right:6px}
#demo .sc{padding:3px 10px;border-radius:999px;border:1px solid #5A4F44;color:#EDE3D3}
#demo .sc.on{background:#EDE3D3;color:#2B2621}
#demo .sp{flex:1}
#demo .tg{padding:3px 10px;border-radius:6px;border:1px solid #5A4F44}
#demo .tg.on{background:#4A3F35}

#app{flex:1;display:flex;min-height:0}
.new{outline:1.5px dashed var(--mark);outline-offset:3px;border-radius:8px;position:relative}
.new>.tag{position:absolute;top:-10px;right:-6px;background:var(--mark);color:#fff;font:600 10.5px/1 var(--sans);padding:3px 5px;border-radius:5px;z-index:5;pointer-events:none}
body.nomark .new{outline:none}body.nomark .new>.tag{display:none}

/* sidebar (0.8.3) */
#side{width:248px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;font-family:var(--serif);font-size:17px;font-weight:700}
.brand small{font-weight:500;font-size:12px;color:var(--ink2)}
.seg{margin:6px 12px;background:var(--rail);border-radius:10px;padding:3px;display:flex}
.seg button{flex:1;padding:5px 0;border-radius:8px;color:var(--muted);font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.wsbtn{margin:6px 8px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--card);font-size:13.5px;width:calc(100% - 16px)}
.wsbtn .n{flex:1;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nav{display:flex;align-items:center;gap:12px;padding:7px 16px;font-size:13.5px;margin:0 4px;border-radius:8px;width:calc(100% - 8px)}
.nav.on{background:var(--accent-soft)}
.badge{margin-left:auto;background:var(--seal);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.search{margin:8px 8px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:3px 10px;background:var(--card);color:var(--muted);font-size:12.5px}
.grp{padding:12px 16px 4px;font-size:12px;color:var(--muted)}
.conv{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 12px;margin:0 8px;border-radius:8px;font-size:13.5px}
.conv.on{background:var(--accent-soft);font-weight:500}
.conv .t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.conv.child{margin-left:24px;font-size:13px;color:var(--ink2);padding-left:8px}
.conv .st{width:7px;height:7px;border-radius:50%;flex:none}
.st.run{background:var(--ok);animation:pulse 1.6s infinite}.st.pause{background:var(--ochre)}.st.block{background:var(--seal)}
@keyframes pulse{50%{opacity:.35}}
.bottom{margin-top:auto;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0}
.bottom button{display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--ink2);gap:2px}
.bottom button.on{color:var(--accent)}

/* main */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line2);font-size:13px;color:var(--ink2)}
.top .crumb b{color:var(--ink);font-weight:500}
.top .sp{flex:1}
.ibtn{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2)}
.ibtn:hover{background:var(--line2)}
.ibtn.on{background:var(--accent-soft);color:var(--accent)}
.scroll{flex:1;overflow:auto;min-height:0}
.chat{max-width:760px;margin:0 auto;padding:22px 24px 12px}
.u{display:flex;justify-content:flex-end;margin:14px 0}.u div{background:var(--bubble);border-radius:14px 14px 4px 14px;padding:9px 14px;max-width:80%}
.a{margin:14px 0;font-family:var(--serif);font-size:15px;line-height:1.85}
.a .meta{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:4px}
.proc{font-family:var(--sans);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:6px}
/* K: work block (thinking + tool calls) inside a reply */
.wb{font-family:var(--sans);border-radius:10px;background:color-mix(in srgb,var(--ink) 5%,transparent);margin:6px 0 10px;overflow:hidden;width:fit-content;min-width:min(420px,100%);max-width:100%}
.wb.open{width:100%}
.wb.err{background:color-mix(in srgb,var(--seal) 8%,transparent)}
.wb-h{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;color:var(--ink2);font-size:13px;text-align:left}
.wb-h .t{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wb-h .n{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.wb-h .e{color:var(--seal);font-size:12px;flex:none}
.wb-h .chev{color:var(--muted);transition:transform .18s ease;flex:none}
.wb.open>.wb-h .chev{transform:rotate(180deg)}
.wb-b{padding:0 0 6px;animation:fadein .12s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* settings write-up rules (from HanaAgent study) */
.srow.sub{padding-left:18px}
.srow .l small.warn{color:var(--seal)}
.inset{background:color-mix(in srgb,var(--ink) 4%,transparent);border-radius:8px;padding:10px 12px;margin:2px 0 10px;font-size:12.5px;color:var(--muted)}
.bubbles{background:color-mix(in srgb,var(--ink) 4%,transparent);border-radius:10px;padding:10px 12px;margin:0 0 10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.bubbles .me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-radius:12px 12px 3px 12px;padding:5px 11px}
.bubbles .bf{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:5px 11px;font-family:var(--serif)}
.tags{color:var(--muted);font-size:11.5px}
.sr{display:flex;align-items:center;gap:8px;padding:3px 12px;font-size:13px;color:var(--ink2);min-height:28px}
.sr.click{cursor:pointer}.sr.click:hover{background:var(--line2)}
.sr .v{flex:none}
.sr .p{display:flex;min-width:0;font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.sr .p .dir{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted)}
.sr .p .fn{flex:none;white-space:nowrap}
.sr .r{margin-left:auto;padding-left:8px;flex:none;color:var(--muted);font-size:12px;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.sr .ic.lead{width:14px;height:14px;color:var(--muted)}
.sr.bad .v,.sr.bad .ic.lead{color:var(--seal)}
.sr.wait .v,.sr.wait .ic.lead{color:var(--ochre)}
.sr .add{color:var(--accent)}.sr .del{color:var(--seal)}
.sr .think-l{color:var(--muted)}
.wb .out{margin:2px 12px 6px 34px;font-family:var(--mono);font-size:12px;background:var(--code);border-radius:8px;padding:6px 10px;white-space:pre-wrap;color:var(--ink2)}
.wb .out.bad{color:var(--seal)}
.wb .think{margin:0 12px 6px 34px;font-size:12.5px;color:var(--muted);line-height:1.75}
.spin{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);border-top-color:var(--ink2);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.bdot{width:8px;height:8px;margin:0 3px;border-radius:50%;background:var(--ochre);animation:pulse 1.2s infinite;flex:none}
.apv{font-family:var(--sans);border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 14px;margin:0 0 10px}
.apv h4{margin:0 0 2px;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:center}
.apv .why{color:var(--muted);font-size:12.5px}
.rb{font-family:var(--sans);border:1px solid var(--line);border-radius:12px;background:var(--card);margin:8px 0;overflow:hidden}
.rb-h{display:flex;align-items:center;gap:4px;padding:5px 6px 5px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line2)}
.rb-h .sp{flex:1}
.rb-body{padding:14px;display:flex;justify-content:center}
.rb pre{margin:0;width:100%;font-family:var(--mono);font-size:12.5px;line-height:1.7;color:var(--ink2);white-space:pre}
/* in-scene demo switch (not part of the app) */
.dsw{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--mark);border:1px dashed var(--mark);border-radius:8px;padding:2px 6px}
.dsw button{padding:1px 8px;border-radius:6px;color:var(--mark)}.dsw button.on{background:var(--mark);color:#fff}
/* L: first run */
.wz2{margin:auto;width:540px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 26px 18px;box-shadow:var(--shadow)}
.wz2 h2{font-family:var(--serif);text-align:center;margin:4px 0 4px;font-size:20px}
.wz2 .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:10px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}.dots i.done{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.wnav{display:flex;align-items:center;gap:8px;margin-top:18px}.wnav .sp{flex:1}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn[disabled]{opacity:.45;cursor:default}
.provs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.prov{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);font-size:13px;text-align:center}
.prov.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fld{display:flex;flex-direction:column;gap:4px;margin:8px 0}.fld label{font-size:12.5px;color:var(--muted);display:flex}.fld label a{margin-left:auto;color:var(--accent);cursor:pointer}
.fld input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg);font-family:var(--mono);font-size:13px}
.state{display:flex;gap:6px;align-items:flex-start;font-size:13px;margin-top:6px}.state.ok{color:var(--ok)}.state.bad{color:var(--seal)}.state.busy{color:var(--muted)}
.home2{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 16px 10px;text-align:center}
.greet2{font-family:var(--art);font-size:34px;letter-spacing:.1em;color:var(--ink)}
.quote2{font-family:var(--serif);font-size:13.5px;color:var(--ink2)}.quote2 cite{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.guide{width:520px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 6px}
.guide h4{margin:0 0 4px;font-family:var(--serif);font-size:15px;font-weight:600}
.gs{display:flex;gap:10px;align-items:center;padding:6px 0}.gs .n{width:20px;height:20px;border-radius:50%;border:1px solid var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.gs .n.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.gs .w{flex:1;font-size:13px}.gs .w b{font-weight:600;display:block}.gs .w span{color:var(--muted);font-size:12px}
.gs a{color:var(--accent);font-size:13px;cursor:pointer}
.exs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:620px}
.ex2{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 14px;color:var(--ink2);font-size:13.5px}
.ex2:hover{border-color:var(--accent)}
.cnote{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);padding:0 4px 6px}.cnote a{color:var(--accent);cursor:pointer}.cnote.bad{color:var(--seal)}
/* M: managed edition */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:1080px;margin:0 auto;padding:18px 28px}
.cmp h3{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 8px;display:flex;gap:8px;align-items:center}
.menu2{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px 0;font-size:13px;width:290px}
.menu2 .g{font-size:11.5px;color:var(--muted);padding:6px 12px 2px}.menu2 .m{padding:5px 12px;display:flex;gap:8px}.menu2 .m.on{background:var(--accent-soft)}.menu2 .m small{margin-left:auto;color:var(--muted)}
.spend{display:flex;gap:6px;align-items:flex-end;height:70px;padding:6px 0}.spend i{flex:1;background:var(--accent);opacity:.75;border-radius:3px 3px 0 0}
/* G3/G4: skills & services */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:900px;margin:0 auto 10px}
.g3 .opt{border:1px solid var(--line);border-radius:12px;background:var(--side);overflow:hidden;cursor:pointer}
.g3 .opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.g3 .cap{font-size:12.5px;padding:8px 12px;background:var(--card);border-top:1px solid var(--line);color:var(--ink2)}
.minibar{padding:8px 4px}
.fb{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:8px 0}
.fb span{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--ink2);gap:2px;position:relative}
.fb .dot{position:absolute;top:-2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.fb .num{position:absolute;top:-6px;right:-6px;font-size:10px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 4px}
.two{display:grid;grid-template-columns:300px 1fr;gap:18px;max-width:1080px;margin:0 auto;padding:4px 28px 22px;min-height:0}
.lst .gh{font-size:12px;color:var(--muted);margin:12px 4px 6px}
.li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13.5px}
.li.on{background:var(--accent-soft)}.li .n{flex:1;min-width:0}.li .n small{display:block;color:var(--muted);font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pill.wait{background:color-mix(in srgb,var(--ochre) 18%,transparent);color:var(--ochre)}.pill.off{background:var(--line2);color:var(--muted)}.pill.bad{background:color-mix(in srgb,var(--seal) 14%,transparent);color:var(--seal)}
.dt{background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:560px}
.dt .hd{display:flex;align-items:center;gap:10px;padding:14px 18px 4px}.dt .hd b{font-family:var(--serif);font-size:18px}
.dt .bd{padding:4px 18px 14px;flex:1}
.dt .one{color:var(--ink2);font-size:13.5px;margin:2px 0 10px}
.dt .kv2{display:grid;grid-template-columns:70px 1fr;gap:4px 12px;font-size:13px;margin:6px 0 12px}.dt .kv2 span:nth-child(odd){color:var(--muted)}
.dt .ft{border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:8px;align-items:center}
.files{display:grid;grid-template-columns:170px 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12.5px}
.files .tree{background:var(--bg);padding:8px 0;border-right:1px solid var(--line)}
.files .tree div{padding:3px 10px;display:flex;gap:6px;align-items:center;font-family:var(--mono)}.files .tree div.on{background:var(--accent-soft)}
.files .pv{padding:10px 14px;font-family:var(--serif);font-size:13px;line-height:1.75;color:var(--ink2)}.files .pv h5{margin:0 0 4px;font-size:14px;color:var(--ink)}
.tool{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line2);font-size:13px}.tool:first-child{border-top:0}.tool code{font-family:var(--mono);font-size:12.5px}.tool .n{flex:1}.tool .n small{display:block;color:var(--muted);font-size:12px}
/* H1: painting themes */
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:10px 0}
.tc{min-width:0;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--bg);cursor:pointer;text-align:left;position:relative}
.tc.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tc .win{height:58px;border-radius:6px;overflow:hidden;display:flex;border:1px solid rgba(0,0,0,.06)}
.tc .nm{font-family:var(--serif);font-size:14px;font-weight:600;margin:6px 2px 0;display:flex;gap:6px;align-items:center}
.tc .wk{font-size:11.5px;color:var(--muted);margin:0 2px 2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tc .new2{font:500 10.5px var(--sans);color:var(--mark);border:1px solid var(--mark);border-radius:4px;padding:0 4px}
.tprev{border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;height:420px;font-family:var(--sans)}
.tprev .ps{width:150px;display:flex;flex-direction:column;padding:12px 10px;gap:6px;position:relative}
.tprev .ps .bn{font-family:var(--serif);font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.tprev .ps .ins{position:absolute;bottom:14px;left:12px;writing-mode:vertical-rl;font-family:var(--serif);font-size:12px;letter-spacing:.2em;opacity:.55}
.tprev .ps .ins.lat{writing-mode:vertical-rl;transform:rotate(180deg);font-style:italic;letter-spacing:.05em;font-size:11px}
.tprev .ps .r{font-size:12px;padding:5px 8px;border-radius:6px}
.tprev .pm{flex:1;padding:18px 22px;display:flex;flex-direction:column;gap:12px;position:relative}
.tprev .gr{font-family:var(--art);font-size:26px;letter-spacing:.1em}
.tprev .qt{font-family:var(--serif);font-size:12.5px;opacity:.8}
.tprev .pc2{border-radius:var(--tr);padding:8px 14px;position:relative;overflow:hidden}
.tprev .pc2 .h{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;padding:4px 0 6px}
.tprev .pc2 .row{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0}
.tprev .mot{position:absolute;right:6px;top:4px;opacity:.5;pointer-events:none}
.tprev .seal{position:absolute;right:18px;bottom:16px}
.tprev .plate{position:absolute;right:20px;bottom:18px;font-family:var(--serif);font-style:italic;font-size:12px;opacity:.7}
.slots{font-size:12.5px;color:var(--ink2);margin-top:10px;display:grid;grid-template-columns:76px 1fr;gap:4px 10px}.slots span:nth-child(odd){color:var(--muted)}
.hint{font-family:var(--sans);display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:10px 0;padding:2px 0}
.hint a{color:var(--accent);text-decoration:none;cursor:pointer}
.hint .ln{flex:1;height:1px;background:var(--line)}
.shot{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0;max-width:420px;background:var(--card)}
.shot .cap{font-family:var(--sans);font-size:12px;color:var(--muted);padding:5px 10px;border-top:1px solid var(--line2)}
.chart{height:120px;display:flex;align-items:flex-end;gap:6px;padding:12px}
.chart i{flex:1;background:color-mix(in srgb,var(--accent) 55%,transparent);border-radius:3px 3px 0 0}
.proactive{font-family:var(--sans);font-size:12px;color:var(--muted);text-align:center;margin:18px 0 4px}

/* question card */
.ask{font-family:var(--sans);border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;margin:10px 0;max-width:560px}
.ask .q{font-weight:500;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.ask .q .timer{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;background:var(--bg)}
.opt:hover,.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt small{display:block;color:var(--muted);font-size:12px}
.ask .row{display:flex;gap:8px;margin-top:8px;align-items:center}
.ask .row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg)}
.lnk{color:var(--accent);font-size:13px}
.done-ask{font-family:var(--sans);font-size:13px;color:var(--muted);margin:10px 0}

/* composer */
.cwrap{padding:0 24px 16px;max-width:808px;margin:0 auto;width:100%}
.plan{border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;background:var(--card);margin:0 12px;font-size:13px;overflow:hidden}
.plan .h{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;color:var(--ink2)}
.plan .h .bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}.plan .h .bar i{display:block;height:100%;background:var(--ok)}
.plan ul{list-style:none;margin:0;padding:2px 12px 8px}
.plan li{display:flex;gap:8px;align-items:center;padding:2px 0;color:var(--ink2)}
.plan li.d{color:var(--muted);text-decoration:line-through}
.plan li.c{color:var(--ink);font-weight:500}
.ck{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none}
li.d .ck{background:var(--ok);border-color:var(--ok);color:#fff}
li.c .ck{border-color:var(--accent)}
.composer{border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:16px;background:var(--card);padding:10px 12px 8px;transition:box-shadow .2s}
.composer.rec{box-shadow:0 0 0 3px color-mix(in srgb,var(--seal) 18%,transparent);border-color:var(--seal)}
.composer textarea{width:100%;border:0;outline:0;background:transparent;resize:none;min-height:24px;font-size:14px}
.crow{display:flex;align-items:center;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--line2);color:var(--ink2)}
.chip.on{background:var(--accent-soft);color:var(--accent)}
.send{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center}
.mic{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2)}
.mic.rec{background:var(--seal);color:#fff}
.wave{display:flex;align-items:center;gap:2px;height:26px;flex:1}
.wave i{flex:1;max-width:4px;background:var(--seal);border-radius:2px;opacity:.8}
.rectime{font-size:12.5px;color:var(--seal);font-variant-numeric:tabular-nums}
.partial{color:var(--muted)}

/* right panel */
#right{width:330px;flex:none;background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
#right .rh{display:flex;align-items:center;height:48px;padding:0 14px 0 18px;font-weight:500}
#right .rh .sp{flex:1}
.blk{margin:4px 14px 14px}
.blk h5{margin:0 0 6px;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:6px;font-weight:600}
.blk h5 .sp{flex:1}.blk h5 small{font-weight:400;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card.ok{border-left:3px solid var(--ok)}
.kv{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin:2px 0}
.goal .stage{font-family:var(--serif);font-size:15px;font-weight:700;margin-bottom:4px}
.goal .next{font-size:13px;color:var(--ink2);margin:4px 0 8px}
.meter{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 0}.meter i{display:block;height:100%;background:var(--accent)}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12.5px;background:var(--card)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.warn{color:var(--seal)}
.job{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:6px 0;border-top:1px solid var(--line2)}
.job:first-child{border-top:0}
.job .n{flex:1;min-width:0}.job .n code{font-family:var(--mono);font-size:12px}
.job .n div{color:var(--muted);font-size:11.5px}
.out{font-family:var(--mono);font-size:11.5px;background:var(--code);border-radius:6px;padding:6px 8px;margin-top:6px;max-height:90px;overflow:auto;white-space:pre}
.file{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.dim{opacity:.55}

/* pages */
.page{max-width:1080px;margin:0 auto;padding:22px 32px}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.ph h1{font-family:var(--art);font-weight:400;font-size:34px;margin:0;line-height:1.2}
.ph .plain{font-size:12px;color:var(--muted);display:block}
.ph .sp{flex:1}
.patrol{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.patrol .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.daily{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px}
.daily .lbl{color:var(--muted)}
.ev{display:inline-flex;gap:6px;align-items:center;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-size:12.5px;cursor:pointer}
.ev.remind{background:var(--ok-soft)}
.cal{display:grid;grid-template-columns:1fr 330px;gap:14px}
.month{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mh{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line2)}
.mh b{font-family:var(--serif);font-size:16px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr)}
.wd{font-size:12px;color:var(--muted);text-align:center;padding:4px 0}
.day{min-height:74px;border-top:1px solid var(--line2);border-left:1px solid var(--line2);padding:4px 6px;font-size:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.day:nth-child(7n+1){border-left:0}
.day .d{font-size:12.5px;color:var(--ink2)}
.day.out .d{color:var(--muted);opacity:.5}
.day.today .d{background:var(--accent);color:var(--on-accent);border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.day.sel{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
.day .e{font-size:11px;padding:0 5px;border-radius:4px;background:var(--accent-soft);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.day .e.past{opacity:.6}
.day .e.fail{background:color-mix(in srgb,var(--seal) 18%,transparent)}
.daylist{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.daylist h3{margin:0 0 8px;font-family:var(--serif);font-size:16px;display:flex;align-items:center}
.daylist h3 .sp{flex:1}
.it{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line2);font-size:13px;cursor:pointer}
.it .tm{width:44px;color:var(--muted);font-variant-numeric:tabular-nums}
.it .w{flex:1}.it .w div{font-size:12px;color:var(--muted)}
.it .r{font-size:12px}
.r.ok{color:var(--ok)}.r.bad{color:var(--seal)}
.det{margin-top:8px;border-top:1px solid var(--line);padding-top:10px;font-size:13px}
.det .f{display:flex;gap:8px;align-items:center;margin:5px 0}
.det .f label{width:56px;color:var(--muted);font-size:12.5px}
.det .f input,.det .f select,.det .f textarea{flex:1;border:1px solid var(--line);border-radius:7px;padding:3px 8px;background:var(--bg);font:inherit;color:inherit}
.det .f.ftop{align-items:flex-start}.det .f.ftop label{padding-top:4px}.det .f textarea{resize:vertical}
.redit .f{display:flex;gap:8px;align-items:flex-start;margin:6px 0}.redit .f label{width:56px;color:var(--muted);font-size:12.5px;padding-top:5px}
.redit input,.redit textarea{flex:1;border:1px solid var(--line);border-radius:7px;padding:4px 8px;background:var(--bg);font:inherit;color:inherit;resize:vertical}
.hist{font-size:12px;color:var(--muted);margin-top:8px}
.log{margin-top:6px;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.log div{display:flex;gap:10px;padding:3px 0}.log span{color:var(--muted);width:44px}

/* inbox */
.ib{max-width:760px;margin:0 auto;padding:22px 24px}
.ib h2{font-size:13px;color:var(--muted);font-weight:500;margin:16px 0 6px;display:flex;gap:8px;align-items:center}
.icard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.icard .from{font-size:12px;color:var(--muted)}
.icard .what{font-weight:500;margin:2px 0}
.icard .why{font-size:13px;color:var(--ink2)}
.icard.decide{border-left:3px solid var(--accent)}.icard.block{border-left:3px solid var(--seal)}.icard.accept{border-left:3px solid var(--ok)}
.rule{font-family:var(--serif);background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:14px}

/* settings */
.set{display:grid;grid-template-columns:170px 1fr;gap:24px;max-width:920px;margin:0 auto;padding:22px 32px}
.snav button{display:flex;width:100%;gap:10px;align-items:center;padding:7px 12px;border-radius:8px;font-size:13.5px;color:var(--ink2)}
.snav button.on{background:var(--card);color:var(--ink);border-left:2px solid var(--accent)}
.sh{display:flex;align-items:center;gap:6px;font-size:13.5px;margin:14px 0 6px;font-weight:500}
.sh:first-child{margin-top:0}
.sh .bfmini{color:var(--accent)}
.scard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 16px}
.srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line2);font-size:14px}
.srow:first-child{border-top:0}
.srow .l{flex:1}.srow .l small{display:block;color:var(--muted);font-size:12px}
.sg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sg button{padding:4px 12px;font-size:13px;color:var(--accent);border-left:1px solid var(--line)}
.sg button:first-child{border-left:0}
.sg button.on{background:var(--accent-soft);color:var(--ink)}
.val{color:var(--accent);font-size:13.5px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 0}
.pc{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);text-align:left;cursor:pointer}
.pc.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pc b{font-family:var(--serif);font-size:18px}
.pc p{margin:4px 0 0;font-family:var(--serif);font-size:12.5px;color:var(--ink2);line-height:1.6}
.sample{font-family:var(--serif);font-size:13.5px;color:var(--ink2);padding:0 0 10px}
.fold{color:var(--accent);font-size:13px;padding:8px 0;display:flex;gap:4px;align-items:center}
.toggle{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;flex:none}
.toggle.on{background:var(--accent)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on::after{left:16px}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(30,25,20,.35);display:flex;align-items:center;justify-content:center;z-index:50}
.dlg{background:var(--card);border-radius:14px;box-shadow:var(--shadow);width:440px;padding:18px 20px}
.dlg h3{margin:0 0 8px;font-family:var(--serif)}
.dlg p{margin:6px 0;font-size:13.5px;color:var(--ink2)}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.radio.on{border-color:var(--accent);background:var(--accent-soft)}
.radio small{display:block;color:var(--muted);font-size:12px}
.dlg .acts{justify-content:flex-end;margin-top:14px}

/* skills */
.slist{max-width:860px;margin:0 auto;padding:22px 32px}
.sk{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.sk .n{flex:1}.sk .n small{display:block;color:var(--muted);font-size:12px}
.pill{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.pill.bf{background:var(--accent-soft);color:var(--accent)}

/* wizard */
.wz{margin:auto;width:520px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;box-shadow:var(--shadow)}
.wz h2{font-family:var(--serif);text-align:center;margin:6px 0 4px}
.wz .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px}

/* workspace menu */
.menu{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;z-index:20;min-width:230px}
.menu .mi{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:7px;font-size:13px}
.menu .mi:hover{background:var(--line2)}
.menu .mi .c{margin-left:auto;color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center}

/* notes drawer */
#notes{position:fixed;right:12px;bottom:12px;width:380px;max-height:60vh;overflow:auto;background:#2B2621;color:#EDE3D3;border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.7;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:60;display:none}
#notes.on{display:block}
#notes h4{margin:0 0 6px;font-size:13px}
#notes b{color:#F5C9A8}
#notes ul{padding-left:18px;margin:4px 0}

schedule:`<h4>日程与巡检（D1–D3）</h4><ul>

goal:`<h4>蝶君对话里的目标（C1、C3–C7、B3、D4）</h4><ul>
<li><b>B3</b> 蝶君主动来找你：消息直接出现在和你的对话里，上面一行小字写时间，不进「等你处理」。夜里不发；你没回之前不发第二条。</li>
<li><b>C1</b> 目标放在右栏「这个对话」最上面（对话上方不放任务头，这是已定型第 2 条）：阶段、一句话目标、下一步、预算条、用时。「暂停目标」「停止目标」两个按钮；「⋯」里是紧急停止，要先确认，说清楚会停下什么、不会删什么。</li>

<li><b>C3</b> 计划贴在输入框顶上，点标题收起或展开。做完的打勾划线，正在做的加粗。没有计划时不出现。</li>
<li><b>C4</b> 提问：三张选项卡片加「自己回答」和「跳过」，限时的写明到点按哪个继续，默认项带「默认」两个字。答过以后收成一行。</li>
<li><b>C6</b> 后台任务在右栏，显示正在跑的命令和子任务、用了多久；眼睛图标看输出（原地展开），方块图标停止。刚结束的变淡，留一会儿。</li>

inbox:`<h4>等你处理（B6、B2）</h4><ul>

<li><b>B1</b> 性格四张卡片，下面一句示例话随选择变化。主动性三档，下面一行写这一档会做什么。</li>
<li>（2026-11-14 按 HanaAgent 调研改的写法）性格的示例改成一问一答的聊天气泡；「夜间不打扰」改成开关，打开后下面缩进出开始、结束两行；列表为空时，在凹进去的浅底框里写「还没有。比如：……」，给一个例子；说明行只写「改了会怎样 / 什么时候生效」。</li>
<li><b>B7</b> 长期目标：你交给蝶君的长期方向，空闲时它自己决定学什么、写什么；每条能暂停，点开看它做过什么。也可以在对话里直接交代。</li><li><b>B2</b> 规则列表：每条都是「关 / 观察 / 自动」三档。</li>
<li><b>D5</b> 日程与巡检：常用的四项直接给出，其余收在「高级」里。</li>
<li><b>E2</b> 语音：本机 / 云端；选云端才出现服务和 Key。</li>
<li><b>F1</b> 卸载：先问保留还是清干净，再启动卸载程序。选保留就写下「保留数据」标记。</li>
<li>左边切到「通用」「数据与安全」可以看另外两处。</li></ul>`,
skills:`<h4>技能和记忆（B4、B5）</h4><ul>
<li><b>B4</b> 蝶君自己写的技能，标「蝶君写的」，默认只给蝶君用。点「也给工作台用」采纳一次以后，标成「工作台也在用」。</li>
<li><b>B5</b> 记忆页（已定型第 16 条）不改布局，分组里加一个「蝶君自己记的」。每条都写来源，可以改、可以删。</li></ul>`,
wizard:`<h4>首次启动（F2、B1）</h4><ul>
<li><b>F2</b> 重装后，如果在原位置找到上次保留的数据，向导第一步问要不要找回来：写明保存时间、大小，以及里面有什么。</li>
<li>「找回来」就搬回数据并重启后台；「重新开始」不删那份数据，告诉你它放在哪里。存储布局不一样、不能自动恢复的，也只给位置。</li>
<li><b>B1</b> 向导里蝶君那一步选性格，四张卡片配示例话，以后在设置里能改。</li>
<li>演示：点「重新开始」→「继续」能看到选性格那一步；点「找回来」看搬回的进度。</li></ul>`,
process:`<h4>回复里的过程（K1–K7，参考 HanaAgent 调研，待用户看过再定）</h4><ul>
<li>（2026-11-14 按 HanaAgent 调研调轻）块不加边框，用很浅的底色；折叠时只和标题一样宽，展开才占满正文宽度；展开内容 0.12 秒淡入，不做高度动画。</li>
<li>思考和工具调用收在回复上方一块里，默认折叠。<b>K1</b> 做完后标题写做了什么（沿用现在的写法：思考了几秒、读取几个文件、运行几条命令……），右边是工具总用时。</li>
<li><b>K2</b> 展开后按发生的顺序，一行一步：图标、动词、对象、右边用时和结果。<b>思考也只占一行</b>「思考 · 4 秒」，点开才看内容（现在折叠时会露出三行思考文字，这里改成一行）。命令点开看输出，改动点开看差异，文件读取不用点开。</li>
<li>路径：目录太长时把目录截短，<b>文件名始终完整</b>；悬停看完整路径。点 K4 最后一行看长路径。</li>
<li><b>K3</b> 进行中：标题写正在做的那一步，右边「前面 N 步」；正在跑的一行用转圈代替勾。<b>K4</b> 同时跑几件事时，标题写「同时在做 3 件事」，每行各自转圈。</li>
<li><b>K5</b> 出错：块的边框和标题的图标变红，标题右边「1 个出错」，出错那一行自动展开，显示报错原文；回复正文用人话说怎么办。</li>
<li><b>K6</b> 等你批准：标题写「等你批准：…」，那一行变赭色；批准卡（0.8.3 原样）紧跟在块下面。</li>
<li><b>K7</b> Mermaid 图、图表：头上一行「图 / 源码」切换，复制源码、放大放在右边。</li>
<li>不改：回复下面那一行（定型第 8 条）、等回复时的蝴蝶和正文不跳（第 12、13 条）。点块的标题展开或收起。</li></ul>`,
onboard:`<h4>首次上手（L1–L5，待用户看过再定）</h4><ul>
<li>步骤和现在的向导一样：数据放哪 → 称呼 → 模型 → 工作区 → 蝶君。有上次保留的数据时，最前面先问要不要找回来（F2，见「首次启动」场景）。</li>
<li><b>L1</b>（开放版）连接模型：服务商做成四张卡片；密钥框右上角是「去 DeepSeek 拿密钥 ↗」，打开服务商官网；<b>粘贴后自动测试</b>，不用再点「测试连接」。失败时说清是哪里不对、怎么改。<b>可以跳过</b>（现在必须测通才能往下）。</li>
<li><b>L2</b> 跳过模型后：首页「开始之前」第一步是「连接一个模型 · 去连接」；按发送时，输入框上面一行说「还没连接模型」并给去处，不弹窗。</li>
<li><b>L3</b>（托管版）这一步换成「输入激活码」：激活后写清模型由谁提供、本月额度；下面一句告诉你内容会经过模型池，并给「数据怎么处理」的链接。激活码不对时说找谁要。托管版不能跳过这一步。</li>
<li><b>L4</b>（托管版）额度用完：输入框上面一行红字，说什么时候恢复、急用找谁。</li>
<li><b>L6</b> 输入框的占位文字轮换成「用法提示」（每 4 秒换一条，打字就停）：拖文件、找蝶君、用 / 调技能。功能靠占位文字被发现，不加说明行（学 HanaAgent 0002、0064、0116）。</li>
<li><b>L5</b> 首页的例子：现在点了就填进输入框、不直接发，这点不变。没选工作区时，例子换成不需要文件夹的事。</li>
<li>页面右上角带虚线的按钮只是演示开关，不是界面的一部分。</li></ul>`,
managed:`<h4>托管版和开放版对照（M1–M4，等用户决定）</h4><ul>
<li>开放版完全照 0.8.3，不动。右边是托管版的建议，每一处都标了碰到的定型条目。</li>
<li><b>M1</b> 设置 › 模型：「模型组」「渠道」两张卡换成一张「模型池」：提供方、本月额度、激活码、数据怎么处理。「用哪个模型」照旧，只列池里的模型。渠道编辑页在托管版里进不去。碰到第 4、5、10 条。</li>
<li><b>M2</b> 输入框的模型按钮写「模型 · 模型池」，列表只有池里的模型，没有模型组和「更多模型…」。碰到第 11 条。</li>
<li><b>M3</b> 回复下面那一行不变；模型池换了模型时，照样写实际用的那个。不碰第 8 条。</li>
<li><b>M4</b> 花费页三选一：照旧 / 只看次数和额度（建议）/ 不显示。碰到第 16 条。</li>
<li>守护测试：开放版原样跑；托管版另写自己的测试，不改原来的期望。</li></ul>`,
skillsx:`<h4>技能和服务（G4）、入口（G3），待用户看过再定</h4><ul>
<li><b>G4</b> 照交互设计 5.1 的「列表 → 详情」：左边分三组，固定顺序：等你确认 → 技能 → 连接的服务，每行名字 + 一个状态 + 一句话；右边是详情，「新建」在右上角。</li>
<li>技能详情：一句话、来源、用过几次、谁在用；下面是文件和 SKILL.md 预览（参考 HanaAgent 的技能预览）。底部「试一下 / 停用 / 删除」。蝶君写的技能多一个「也给工作台用」。</li>
<li>服务详情：每个工具一行，可以单独关；会改东西的工具标「改东西，先问我」。连接方式里密钥只显示圆点。底部固定「测试连接 / 保存」，和渠道编辑页一样（定型第 5 条的做法）。连不上时说人话，告诉你去哪里修。</li>
<li>等你确认的技能：来源、沙箱里试了几次、会做什么事，「采用 / 不要 / 试一下」。它也照旧出现在「等你处理」里。</li>
<li><b>G3</b> 入口三个方案，点卡片切换。建议 <b>B</b>：底栏不动，有等你确认的技能时「技能」上出一个点，这周新记住的条数标在「记忆」上，看过就消失。C 会改侧栏布局，要用户点头。</li></ul>`,
themes:`<h4>名画主题（H1，待用户看过再定）</h4><ul>
<li>选主题照旧分「白天」「夜里」两组，各自独立选，明暗跟随系统时自动换。卡片是小窗缩略 + 名字 + 作品，「新」是这次新加的三套：<b>千蝶</b>（神坂雪佳《蝶千种》）、<b>幻蝶</b>（雷东《蝴蝶》）、<b>石青</b>（清同治平金百蝶坎肩）。三套都来自 2026-11-01 的主题调研，作品信息上线前再核一遍。</li>
<li>给每套主题补「从画里来的细节」，但<b>只放在固定的几处</b>，其他地方不加花（HanaAgent 的经验：装饰只放一处，整体才安静）：① 卡片里的分隔线样式 ② 卡片右上角一枚极淡的纹样 ③ 侧栏底部的题字 ④ 角落的印章或图版号 ⑤ 主色和圆角。</li>
<li>不变的：布局、字号、按钮形状、卡片标题前的小蝴蝶（定型第 4 条，只换颜色）。</li>
<li>点左边的卡片，右边预览换成那一套。</li></ul>`,
workbench:`<h4>工作台侧栏（G1、G2）</h4><ul>
<li><b>G1</b> 分叉和侧边对话挂在原对话下面，缩进加分支图标；原对话折叠时一起收起。</li>
<li><b>G2</b> 顶栏加「分支」按钮：从当前位置分出一个新对话，挂在原对话下面。工作区下拉里，每个工作区写对话数和在运行的个数（点工作区按钮看）。</li>
<li>E1 的麦克风在工作台输入框里也有。</li></ul>`};

/* ---------- render ---------- */
function render(){
 document.documentElement.dataset.theme=S.theme;
 document.body.classList.toggle('nomark',!S.marks);
 $('#demo').innerHTML=`<b>0.12 新增（演示）</b>${SCENES.map(([k,t])=>`<button class="sc ${S.scene===k?'on':''}" data-a="go" data-s="${k}">${t}</button>`).join('')}<span class="sp"></span>
  <button class="tg ${S.marks?'on':''}" data-a="marks">标出新增</button><button class="tg ${S.notes?'on':''}" data-a="notes">交互说明</button><button class="tg" data-a="theme">${S.theme==='light'?'深色':'浅色'}</button>`;
 const v=V[S.scene]();
 $('#side').innerHTML=v.side;$('#side').style.display=v.side?'':'none';
 $('#main').innerHTML=v.main;
 $('#right').innerHTML=v.right||'';$('#right').style.display=v.right?'':'none';
 $('#notes').innerHTML=NOTES[S.scene];
 if(!S.keepScroll){const sc=document.querySelector('#main .scroll');if(sc&&document.querySelector('#main .chat'))sc.scrollTop=sc.scrollHeight;}$('#notes').classList.toggle('on',S.notes);
}
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.a==='mode'){S.evMode=e.target.value;render();}});
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t){if(S.wsMenu&&!e.target.closest('.menu')){S.wsMenu=false;render();}return;}
 const a=t.dataset.a,v=t.dataset.v;
 if(a==='go'){S.scene=t.dataset.s;S.wsMenu=false;}
 else if(a==='marks')S.marks=!S.marks;else if(a==='notes')S.notes=!S.notes;
 else if(a==='theme')S.theme=S.theme==='light'?'dark':'light';
 else if(a==='day'){if(!t.dataset.d)return;S.selDay=+t.dataset.d;S.openEv=null;S.evMode=null;}
 else if(a==='newEv'){S.openEv='new';S.evMode=null;}
 else if(a==='mode')return;
 else if(a==='ev'){if(!t.dataset.e)return;S.openEv=S.openEv===t.dataset.e?null:t.dataset.e;S.evMode=null;}
 else if(a==='log')S.logOpen=!S.logOpen;
 else if(a==='plan')S.planOpen=!S.planOpen;
 else if(a==='ans')S.askAns=v;
 else if(a==='job')S.jobOpen=S.jobOpen===t.dataset.j?null:t.dataset.j;
 else if(a==='estop')S.estop=!S.estop;
 else if(a==='rule'){S.inboxRule=v;S.ruleEdit=false;}
 else if(a==='ruleEdit')S.ruleEdit=!S.ruleEdit;
 else if(a==='mic')toggleMic();
 else if(a==='tab')S.setTab=v;else if(a==='persona')S.persona=v;else if(a==='pro')S.pro=v;
 else if(a==='adv')S.advOpen=!S.advOpen;else if(a==='cloud')S.cloud=v==='1';
 else if(a==='uninst')S.uninst=!S.uninst;else if(a==='keep')S.keep=v;
 else if(a==='restore')S.restore=v==='reset'?null:v;
 else if(a==='ws')S.wsMenu=!S.wsMenu;
 else if(a==='wb'){const cur=S.wbOpen[v]??(v!=='k1');S.wbOpen[v]=!cur;S.keepScroll=true;}
 else if(a==='row'){S.rowOpen[v]=!S.rowOpen[v];S.keepScroll=true;}
 else if(a==='src'){S.src=v==='1';S.keepScroll=true;}
 else if(a==='set'){S[t.dataset.k]=v==='true'?true:v==='false'?false:v;S.keepScroll=true;}
 else if(a==='fill')S.fill=v;
 else if(a==='try'){if(S.ed==='open'&&S.noModel)S.tried=true;}
 else if(a==='ob'){
  if(v==='reset'){S.ob=0;S.obT='';S.obA='';S.noModel=false;S.tried=false;S.fill='';}
  else if(v==='toModel'){S.ob=3;S.obT='';}
  else{if(S.ob===3&&S.ed==='open')S.noModel=t.dataset.k==='noModel';S.ob=Math.max(0,Math.min(6,S.ob+(+v)));}
 }
 render();S.keepScroll=false;
});
/* voice demo */
const PHRASE='帮我把重连的最长等待改成三十秒，再加一条日志';
let micTimer=null,waveTimer=null;
function toggleMic(){
 if(S.rec){S.rec=false;clearInterval(micTimer);clearInterval(waveTimer);S.recText=PHRASE;return;}
 S.rec=true;S.recT=0;S.recText='';let n=0;
 micTimer=setInterval(()=>{S.recT++;n=Math.min(PHRASE.length,n+5);S.recText=PHRASE.slice(0,n);render();},1000);
 waveTimer=setInterval(()=>{document.querySelectorAll('#wave i').forEach(i=>i.style.height=(3+Math.random()*20)+'px');},90);
}
setInterval(()=>{if(S.scene==='onboard'&&S.ob===6&&!S.fill){S.tip++;const ta=document.querySelector('.composer textarea');if(ta)ta.placeholder=['说点什么…','试试把一个表格文件拖进来','想让蝶君替你盯着一件事？去蝶君那边说','输入 / 用技能'][S.tip%4];}},4000);
setInterval(()=>{if(S.scene==='goal'&&!S.askAns&&S.askLeft>0){S.askLeft--;const el=document.querySelector('.ask .timer');if(el)el.textContent=`${fmt(S.askLeft)} 后按「先不算」继续`;}},1000);
const q=new URLSearchParams(location.search);
if(q.get('s'))S.scene=q.get('s');if(q.get('t'))S.theme=q.get('t');if(q.get('n'))S.notes=true;for(const k of ['openEv','setTab','restore','keep','evMode']){if(q.get(k))S[k]=q.get(k);}for(const k of ['logOpen','planOpen','estop','wsMenu','uninst','cloud','advOpen','ruleEdit']){if(q.get(k))S[k]=true;}if(q.get('day'))S.selDay=+q.get('day');for(const k of ['ed','obT','obA','mSpend','skSel','g3','thPick'])if(q.get(k)!==null)S[k]=q.get(k);if(q.get('ob'))S.ob=+q.get('ob');for(const k of ['noModel','quota','tried'])if(q.get(k))S[k]=true;if(q.get('ans'))S.askAns=q.get('ans');if(q.get('nomark'))S.marks=false;
render();if(q.get('rec'))toggleMic();if(q.get('tab'))S.setTab=q.get('tab'),render();
</script>
</body>
</html>
