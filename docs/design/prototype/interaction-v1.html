<title>DreamFlutter 梦蝶 交互原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: desktop app shell — sidebar | main conversation/page | optional right panel; tokens mirror app/lib/theme.dart (蛱蝶 / 墨夜) */
:root{
  --rail:#E8E0D3; --side:#F0EAE0; --bg:#F7F3EB; --card:#FDFBF7; --bubble:#EFE5D6;
  --ink:#392F2A; --ink2:#52463E; --muted:#70665E; --line:#DED6C9; --line2:rgba(57,47,42,.07);
  --accent:#A54C28; --on-accent:#FDFBF7; --accent-soft:#F0DFCF; --ok:#546C5D; --ok-soft:rgba(84,108,93,.12);
  --ochre:#B5793F; --seal:#A8332A; --code:#F1EADF; --term:#2E2A24; --on-term:#E8DFCB;
  --add:rgba(84,108,93,.16); --del:rgba(168,51,42,.12); --shadow:0 10px 30px rgba(57,47,42,.13);
  --bf-bg:#F0EAE0; --bf-line:#392F2A; --bf-core:#FDFBF7; --bf-wing:#C96A3F; --bf-glow:#F0DFCF;
  --art:"Ma Shan Zheng","KaiTi","STKaiti",serif; --serif:"Noto Serif SC","Songti SC","SimSun",serif; --sans:"Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SFMono-Regular",monospace;
  --t1:150ms; --t2:250ms; --t3:350ms; --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --rail:#1D1A17; --side:#221F1C; --bg:#27231F; --card:#302A25; --bubble:#3A322B;
  --ink:#F0E5D6; --ink2:#DCCFBE; --muted:#B9AB9B; --line:#4C4238; --line2:rgba(240,229,214,.07);
  --accent:#E6A17A; --on-accent:#27231F; --accent-soft:#49352B; --ok:#9EAF92; --ok-soft:rgba(158,175,146,.14);
  --ochre:#D9A066; --seal:#E07A6C; --code:#1F1B18; --term:#14120F; --on-term:#E8DFCB;
  --add:rgba(158,175,146,.18); --del:rgba(224,122,108,.18); --shadow:0 10px 30px rgba(0,0,0,.45);
  --bf-bg:#221F1C; --bf-line:#FFFFFF; --bf-core:#302A25; --bf-wing:#E6A17A; --bf-glow:#49352B; color-scheme:dark}}
:root[data-theme="dark"]{
  --rail:#1D1A17; --side:#221F1C; --bg:#27231F; --card:#302A25; --bubble:#3A322B;
  --ink:#F0E5D6; --ink2:#DCCFBE; --muted:#B9AB9B; --line:#4C4238; --line2:rgba(240,229,214,.07);
  --accent:#E6A17A; --on-accent:#27231F; --accent-soft:#49352B; --ok:#9EAF92; --ok-soft:rgba(158,175,146,.14);
  --ochre:#D9A066; --seal:#E07A6C; --code:#1F1B18; --term:#14120F; --on-term:#E8DFCB;
  --add:rgba(158,175,146,.18); --del:rgba(224,122,108,.18); --shadow:0 10px 30px rgba(0,0,0,.45);
  --bf-bg:#221F1C; --bf-line:#FFFFFF; --bf-core:#302A25; --bf-wing:#E6A17A; --bf-glow:#49352B; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bf{display:block}

#app{height:100%;display:grid;grid-template-columns:248px minmax(0,1fr) auto;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
/* sidebar */
#side{background:var(--side);border-right:1px solid var(--line2);display:flex;flex-direction:column;min-width:0;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;font-family:var(--serif);font-size:17px;font-weight:700}
.logo{display:inline-grid;place-items:center;flex:none;width:26px;height:26px;border-radius:7px;background:var(--bf-bg)}.logo svg{width:100%;height:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--rail);border-radius:10px;padding:3px;margin:6px 12px 10px;position:relative}
.seg button{position:relative;z-index:1;padding:6px 0;border-radius:8px;color:var(--muted);transition:color var(--t1) var(--ease)}
.seg button.on{color:var(--ink);font-weight:500}
.seg .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--card);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform var(--t2) var(--ease)}
.seg.right .knob{transform:translateX(100%)}
.seg .dot{position:absolute;top:7px;right:12px;width:6px;height:6px;border-radius:50%;background:var(--ochre);animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{opacity:.25}}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.nav-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink2);text-align:left;transition:background var(--t1) var(--ease)}
.nav-i:hover{background:var(--line2)}
.nav-i.on{background:var(--card);color:var(--ink)}
.badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--seal);color:#fff;font-size:12px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.badge.pop{animation:pop var(--t3) var(--ease)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.search{margin:4px 8px 6px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line2);color:var(--muted)}
.search input{border:0;background:none;outline:0;width:100%;min-width:0;color:var(--ink)}
.list{flex:1;overflow:auto;padding:4px 8px 8px;min-height:0}
.grp{font-size:12px;color:var(--muted);padding:12px 10px 4px;letter-spacing:.06em}
.conv{display:flex;align-items:center;gap:6px;border-radius:8px;padding:6px 6px 6px 10px;color:var(--ink2);cursor:pointer;transition:background var(--t1) var(--ease)}
.conv:hover{background:var(--line2)}
.conv.on{background:var(--card);color:var(--ink)}
.conv .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv.child{padding-left:26px;font-size:13px;color:var(--muted)}
.conv .more{opacity:0;padding:3px;border-radius:6px;color:var(--muted);transition:opacity var(--t1)}
.conv:hover .more,.conv.on .more{opacity:1}
.conv .run{width:6px;height:6px;border-radius:50%;background:var(--ochre);animation:breathe 1.6s infinite}
.side-foot{display:flex;gap:2px;padding:8px;border-top:1px solid var(--line2)}
.side-foot button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:8px;font-size:11px;color:var(--muted);transition:background var(--t1),color var(--t1)}
.side-foot button:hover{background:var(--line2);color:var(--ink)}
.side-foot button.on{color:var(--accent)}

/* main */
#main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.top{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line2)}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;color:var(--muted);font-size:13px}
.crumb b{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ws-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;color:var(--ink2);background:var(--card);white-space:nowrap}
.top .sp{flex:1}
.icon-btn{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;color:var(--muted);transition:background var(--t1),color var(--t1)}
.icon-btn:hover{background:var(--line2);color:var(--ink)}
.icon-btn.on{color:var(--accent);background:var(--accent-soft)}
#menuBtn{display:none}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view.enter{animation:viewIn var(--t3) var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow:auto;min-height:0}
.col{max-width:760px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}

/* messages */
.msg{margin:0 0 22px}
.msg.enter{animation:rise var(--t2) var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.u{display:flex;justify-content:flex-end}
.u .b{background:var(--bubble);border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:80%}
.quote{border-left:3px solid var(--accent);padding:2px 10px;margin-bottom:6px;color:var(--muted);font-size:13px}
.proc{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:12px;overflow:hidden}
.proc-h{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;color:var(--ink2);font-size:13px;text-align:left}
.proc-h .chev{margin-left:auto;transition:transform var(--t2) var(--ease)}
.proc.open .chev{transform:rotate(180deg)}
.proc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t2) var(--ease)}
.proc.open .proc-b{grid-template-rows:1fr}
.proc-b>div{overflow:hidden}
.step{display:flex;gap:8px;align-items:flex-start;padding:5px 12px;font-size:13px;color:var(--ink2);border-top:1px solid var(--line2)}
.step code,.reply code{font-family:var(--mono);font-size:12.5px;background:var(--code);padding:1px 5px;border-radius:5px}
.step .ok,.proc-h .ok{color:var(--ok)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ochre);animation:breathe 1.2s infinite;flex:none}
.reply{font-family:var(--serif);font-size:15.5px;line-height:1.85;color:var(--ink)}
.reply p{margin:0 0 10px}
.reply table{border-collapse:collapse;font-family:var(--sans);font-size:13.5px;margin:6px 0 12px;font-variant-numeric:tabular-nums}
.reply th,.reply td{border-bottom:1px solid var(--line);padding:5px 14px 5px 0;text-align:left}
.reply th{color:var(--muted);font-weight:500}
.tbl{overflow-x:auto}
.ainfo{display:flex;align-items:center;gap:2px;margin-top:4px;color:var(--muted);font-size:12px;opacity:0;transition:opacity var(--t1)}
.msg:hover .ainfo,.msg:focus-within .ainfo,.ainfo.show{opacity:1}
.ainfo .icon-btn{width:30px;height:28px}
.ainfo .meta{margin-left:8px}
.memnote{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px}
.memnote button{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.approve h4{margin:0 0 2px;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:center}
.approve .why{color:var(--muted);font-size:13px;margin-bottom:10px}
.diff{font-family:var(--mono);font-size:12.5px;border-radius:8px;overflow:auto;background:var(--code);margin-bottom:12px}
.diff div{padding:1px 10px;white-space:pre}
.diff .a{background:var(--add)} .diff .d{background:var(--del)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);transition:background var(--t1),transform var(--t1)}
.btn:hover{background:var(--line2)} .btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.sm{padding:3px 10px;font-size:13px}
.state{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.state.ok{color:var(--ok)} .state.no{color:var(--seal)}
.err{border-color:color-mix(in srgb,var(--seal) 40%,transparent)}
.err .why{color:var(--ink2)}

/* composer */
.composer-wrap{flex:none;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.composer{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px 8px;box-shadow:0 2px 10px rgba(0,0,0,.04);transition:border-color var(--t1)}
.composer:focus-within{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.composer textarea{width:100%;border:0;outline:0;background:none;resize:none;min-height:24px;max-height:160px;line-height:1.6}
.qchip{display:flex;gap:8px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:6px 10px;margin-bottom:6px;font-size:13px;color:var(--ink2)}
.qchip .x{margin-left:auto;color:var(--muted)}
.crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--ink2);font-size:12.5px;border:1px solid transparent;transition:background var(--t1),border-color var(--t1)}
.chip:hover{border-color:var(--line)}
.chip.on{background:var(--accent-soft);color:var(--accent)}
.crow .sp{flex:1}
.send{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);transition:transform var(--t1),opacity var(--t1)}
.send:disabled{opacity:.35;cursor:default}
.send.stop{background:var(--ink2)}

/* home */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;text-align:center}
.home svg.bf{width:72px;height:72px;border-radius:18px;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px) rotate(-1.5deg)}}
.greet{font-family:var(--art);font-weight:400;font-size:38px;letter-spacing:.12em;background:linear-gradient(90deg,var(--ink),var(--accent),var(--ochre));-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.examples{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:620px}
.ex{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;color:var(--ink2);font-size:13.5px;transition:transform var(--t1),border-color var(--t1)}
.ex:hover{transform:translateY(-2px);border-color:var(--accent)}

/* pages */
.page-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-h h1{font-family:var(--serif);font-size:24px;margin:0;font-weight:700}
.page-h p{margin:0;color:var(--muted);font-size:13px;flex-basis:100%}
.page-h .sp{flex:1}
.sec{font-size:12px;color:var(--muted);letter-spacing:.08em;margin:22px 0 8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line2);border-radius:12px;margin-bottom:8px;transition:opacity var(--t2) var(--ease),transform var(--t2) var(--ease),background var(--t1)}
.row.enter{animation:rise var(--t2) var(--ease)}
.row.leave{opacity:0;transform:translateX(24px)}
.row .main{flex:1;min-width:0}
.row .ttl{font-weight:500}
.row .sub{color:var(--muted);font-size:12.5px}
.row.click{cursor:pointer} .row.click:hover{background:color-mix(in srgb,var(--card) 85%,var(--accent-soft))}
.row.sel{border-color:var(--accent)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--line2);color:var(--muted)}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.wait{background:color-mix(in srgb,var(--ochre) 15%,transparent);color:var(--ochre)}
.st.bad{background:color-mix(in srgb,var(--seal) 13%,transparent);color:var(--seal)}
.st.run{background:color-mix(in srgb,var(--ochre) 12%,transparent);color:var(--ochre)}
.st.run::before{animation:breathe 1.2s infinite}
.from{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.detail{position:sticky;top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;margin:10px 0 14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color var(--t1),border-color var(--t2)}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.mem{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;transition:background var(--t1),opacity var(--t2),transform var(--t2)}
.mem:hover{background:var(--card)}
.mem .txt{flex:1;min-width:0;outline:0;border-radius:6px;padding:1px 4px;margin:-1px -4px}
.mem .txt:focus{background:var(--card);box-shadow:0 0 0 1px var(--accent)}
.mem .src{font-size:12px;color:var(--muted)}
.mem .src button{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.mem .ops{opacity:0;display:flex;gap:2px;transition:opacity var(--t1)}
.mem:hover .ops,.mem:focus-within .ops{opacity:1}
.mem.leave,.row.leave{opacity:0;transform:translateX(24px)}
.timeline .day{font-size:13px;color:var(--muted);margin:14px 0 6px}
.tl{display:flex;gap:10px;padding:6px 0;font-size:13.5px}
.tl .k{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--line2);color:var(--muted);flex:none}
.tl .k.add{background:var(--ok-soft);color:var(--ok)}
.switch{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;flex:none;transition:background var(--t2) var(--ease)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform var(--t2) var(--ease)}
.switch.on{background:var(--accent)} .switch.on::after{transform:translateX(16px)}
/* settings */
.set{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px}
.set-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
.set-nav button{text-align:left;padding:7px 12px;border-radius:8px;color:var(--ink2)}
.set-nav button.on{background:var(--card);color:var(--ink);font-weight:500}
.srow{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line2)}
.srow .main{flex:1;min-width:0}
.srow .hint{font-size:12.5px;color:var(--muted)}
.q{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--line);font-size:11px;color:var(--muted);margin-left:4px;cursor:help;position:relative}
.q:hover::after{content:attr(data-tip);position:absolute;left:50%;bottom:130%;transform:translateX(-50%);width:220px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.5;padding:8px 10px;border-radius:8px;z-index:5;text-align:left}
.segs{display:inline-flex;background:var(--bg);border-radius:8px;padding:2px;border:1px solid var(--line2);flex-wrap:wrap}
.segs button{padding:4px 10px;border-radius:6px;font-size:13px;color:var(--muted);transition:background var(--t1),color var(--t1)}
.segs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
details.adv{margin-top:14px}
details.adv summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0;list-style:none;display:flex;gap:6px;align-items:center}
details.adv summary::-webkit-details-marker{display:none}
details.adv[open] summary .ic{transform:rotate(90deg)}
details.adv summary .ic{transition:transform var(--t2) var(--ease);width:14px;height:14px}

/* right panel */
#right{width:0;overflow:hidden;transition:width var(--t3) var(--ease);background:var(--side);border-left:1px solid var(--line2);min-height:0}
#right.open{width:340px}
.rp{width:340px;height:100%;display:flex;flex-direction:column}
.rp-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line2);font-weight:500}
.rp-h .sp{flex:1}
.rp-b{flex:1;overflow:auto;padding:12px 14px}
.file{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--card);margin-bottom:6px;font-size:13px}
.file .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12.5px}
.file .p{color:var(--accent);font-size:12px} .file .m{color:var(--seal);font-size:12px}
.commit textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px;resize:vertical;font-family:var(--mono);font-size:12.5px}
.deliver{border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--card) 80%,var(--accent-soft))}
.deliver h4{margin:0 0 6px;font-family:var(--serif);font-size:16px}
.mini{display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.mini .u .b{font-size:13px}
.countdown{height:3px;background:var(--line2);border-radius:2px;overflow:hidden;margin:8px 0 10px}
.countdown i{display:block;height:100%;background:var(--accent);transform-origin:left;animation:shrink linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.prog{height:4px;border-radius:2px;background:var(--line2);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--ochre);transition:width var(--t3) var(--ease)}

/* popovers, menus, toast */
.pop{position:fixed;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:150px;animation:popIn var(--t1) var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.pop button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;border-radius:7px;font-size:13.5px}
.pop button:hover{background:var(--line2)}
.pop button.danger{color:var(--seal)}
.pop hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
.pop .lbl{font-size:11.5px;color:var(--muted);padding:6px 10px 2px}
.selpop{display:flex;gap:2px;padding:3px;min-width:0}
.selpop button{width:auto;padding:5px 10px}
#toasts{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:60;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;animation:toastIn var(--t3) var(--ease)}
.toast.out{animation:toastOut var(--t2) var(--ease) forwards}
.toast button{color:var(--bf-glow);font-weight:500}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
.notif{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));z-index:61;width:300px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:10px;animation:notifIn var(--t3) var(--ease);cursor:pointer}
.notif .logo{width:30px;height:30px;border-radius:8px}
.notif .from{margin-bottom:2px}
.notif.out{animation:toastOut var(--t2) var(--ease) forwards}
@keyframes notifIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

/* wizard */
#wiz{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));animation:fade var(--t3) var(--ease)}
@keyframes fade{from{opacity:0}}
.wz{width:min(520px,100%)}
.wz-dots{display:flex;gap:6px;justify-content:center;margin-bottom:28px}
.wz-dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width var(--t2) var(--ease),background var(--t2)}
.wz-dots i.on{width:24px;background:var(--accent)} .wz-dots i.done{background:var(--accent)}
.wz-step{animation:viewIn var(--t3) var(--ease)}
.wz h2{font-family:var(--serif);font-size:24px;margin:0 0 6px;text-align:center}
.wz .lead{color:var(--muted);text-align:center;margin:0 0 22px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--ink2)}
.field input,.field select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;outline:0;width:100%}
.field input:focus,.field select:focus{border-color:var(--accent)}
.field .hint{font-size:12px;color:var(--muted)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px;cursor:pointer;transition:border-color var(--t1)}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt .r{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);margin-top:3px;flex:none;transition:border var(--t1)}
.opt.on .r{border:5px solid var(--accent)}
.wz-nav{display:flex;gap:8px;margin-top:22px}
.wz-nav .sp{flex:1}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:rot .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes rot{to{transform:rotate(360deg)}}
.splash{text-align:center}
.splash svg{width:84px;height:84px;border-radius:20px;margin:0 auto 18px;animation:float 3s ease-in-out infinite}
.bar{width:240px;height:4px;border-radius:2px;background:var(--line2);margin:14px auto 8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s var(--ease)}

/* demo guide */
#guide{position:fixed;left:calc(260px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;font-size:12.5px;max-width:280px;box-shadow:var(--shadow);transition:transform var(--t3) var(--ease),opacity var(--t3)}
#guide.min{transform:translateY(calc(100% - 34px))}
#guide b{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-weight:500;cursor:pointer}
#guide ol{margin:0;padding-left:18px;color:color-mix(in srgb,var(--bg) 80%,transparent)}
#guide li{margin:2px 0}
#guide li button{color:var(--bf-glow);text-decoration:underline;text-underline-offset:2px}
#scrim{display:none}

/* signature butterfly presence (from DreamFlutter Design Kit v0.1) */
.avatar{width:84px;height:84px;flex:none;display:grid;place-items:center;filter:drop-shadow(0 6px 8px rgba(165,76,40,.14))}
.avatar svg{width:84px;height:84px;transform-origin:50% 55%}
.avatar[data-state="received"] svg{animation:flap .28s ease-in-out 3}
.avatar[data-state="thinking"] svg{animation:flapSlow 2.4s ease-in-out infinite}
.avatar[data-state="search"] svg{animation:seek 1.6s ease-in-out infinite}
.avatar[data-state="reading"] svg{animation:flapSlow 1.8s ease-in-out infinite}
.avatar[data-state="working"] svg,.avatar[data-state="writing"] svg{animation:flap .9s ease-in-out infinite,bob 2.2s ease-in-out infinite}
.avatar[data-state="done"] svg{animation:settle .9s var(--ease) 1}
.avatar[data-state="error"] svg{filter:saturate(.35);opacity:.8}
.avatar[data-state="idle"] svg{animation:float 5s ease-in-out infinite}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.78)}}
@keyframes flapSlow{0%,100%{transform:scaleX(1) translateY(0)}50%{transform:scaleX(.9) translateY(-2px)}}
@keyframes seek{0%,100%{transform:rotate(-8deg) scaleX(1) translateX(0)}50%{transform:rotate(-12deg) scaleX(.84) translateX(4px)}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -4px}}
@keyframes settle{0%{transform:scaleX(1)}40%{transform:scaleX(.7)}100%{transform:scaleX(1)}}
.presence{display:flex;align-items:center;gap:14px;margin:4px 0 10px;min-height:92px}
.presence .copy{flex:1;min-width:0}
.presence .by{font-size:11px;color:var(--accent);letter-spacing:.08em}
.presence .by span{color:var(--muted);margin-left:8px}
.art{font-family:var(--art);font-weight:400}
.presence h3{font-family:var(--art);font-weight:400;font-size:28px;line-height:1.5;margin:0 0 2px;color:var(--ink)}
.presence h3 span{display:inline-block;animation:inkIn .45s both;animation-delay:calc(var(--i) * 28ms)}
@keyframes inkIn{from{opacity:0;transform:translateY(5px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
.presence .meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.presence .meta time{font-variant-numeric:tabular-nums}
.ink{height:10px;position:relative;margin-top:6px;overflow:hidden;border-bottom:1px solid var(--line);border-radius:0 0 40% 0}
.ink span{position:absolute;width:35%;height:1px;bottom:0;left:-36%;background:var(--accent);border-radius:100%;opacity:0}
.presence.active .ink span{opacity:1;animation:inkTravel 2.5s ease-in-out infinite}
@keyframes inkTravel{0%{left:-36%;opacity:0}20%{opacity:1}80%{opacity:1}100%{left:100%;opacity:0}}
.reply.stream::after{content:"";display:inline-block;width:.5em;height:1em;vertical-align:-.15em;border-left:2px solid var(--accent);animation:breathe 1s infinite}
.quoteline{display:flex;gap:12px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;max-width:560px;background:color-mix(in srgb,var(--accent-soft) 45%,transparent);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:10px 16px;font-family:var(--serif);font-size:15px;color:var(--ink2);text-align:left}
.quoteline cite{font-style:normal;font-size:12px;color:var(--muted)}
.page-h .eyebrow{flex-basis:100%;font-size:11px;letter-spacing:.18em;color:var(--accent)}
.page-h h1.art{font-family:var(--art);font-weight:400;font-size:34px;line-height:1.3}
@media (max-width:1000px){#right.open{position:absolute;right:0;top:0;bottom:0;z-index:30;box-shadow:var(--shadow)} #app{grid-template-columns:248px minmax(0,1fr) 0}}

}

const conv = id => S.convs.find(c => c.id === id || c.children.some(k => k.id === id));
const task = id => S.tasks.find(t => t.id === id);
const nowCount = () => S.inbox.length;
const timers = {};
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ST = {
  received:{t:'接住你的念头', row:3, a:1}, thinking:{t:'让思绪慢慢成形', row:6, a:1}, search:{t:'循着线索探寻', row:1, a:1},
  reading:{t:'翻阅字里行间', row:7, a:1}, working:{t:'让想法落地', row:9, a:1}, review:{t:'这一笔等你点头', row:0, a:0},
  writing:{t:'将思绪写给你', row:9, a:1}, done:{t:'这一页写好了', row:3, a:0}, paused:{t:'在这里停一停', row:0, a:0},
  error:{t:'这一笔暂未落下', row:0, a:0}, cancelled:{t:'先把这一页合上', row:0, a:0}, idle:{t:'念头在此停驻', row:0, a:0}
};
const sprite = (state, cls='') => { const k = ST[state] || ST.idle; return '<div class="avatar '+cls+'" data-state="'+(state in ST ? state : 'idle')+'" role="img" aria-label="蝴蝶：'+k.t+'"><svg viewBox="0 0 1024 1024" aria-hidden="true"><use href="#bf"/></svg></div>'; };
setInterval(() => {
  document.querySelectorAll('time[data-t0]').forEach(el => { el.textContent = Math.floor((Date.now() - +el.dataset.t0) / 1000) + 's'; });
}, 160);
function presence(x, who){
  const k = ST[x.state] || ST.thinking;
  const fresh = x._shown !== x.state; x._shown = x.state;
  const title = fresh && !REDUCED ? [...k.t].map((c,i)=>'<span style="--i:'+i+'">'+esc(c)+'</span>').join('') : esc(k.t);
  return '<div class="presence '+(k.a && !REDUCED ? 'active' : '')+'" data-mid="'+x.id+'">'+sprite(x.state)+'<div class="copy"><div class="by">'+who+'<span>'+(x.state==='review'?'等你决定':'正在做')+'</span></div><h3>'+title+'</h3><div class="meta"><span>'+esc(x.proc && x.proc.now || '')+'</span><time data-t0="'+(x.t0 || Date.now())+'">0s</time></div><div class="ink"><span></span></div></div></div>';
}

/* ---------- render ---------- */
function render(){ renderSide(); renderMain(); renderRight(); renderGuide(); S.fresh.clear(); }

function renderSide(){
  const inSpace = S.space === 'wb' ? S.convs.filter(c => c.ws === S.ws) : [];
  const groups = ['今天','昨天','本周'];
  const djBusy = S.tasks.some(t => t.status === 'run');
  let list = '';
  if (S.space === 'wb'){
    for (const g of groups){
      const cs = inSpace.filter(c => c.when === g); if (!cs.length) continue;
      list += `<div class="grp">${g}</div>`;
      for (const c of cs){
        list += `<div class="conv ${S.view==='chat'&&S.activeConv===c.id?'on':''} ${S.fresh.has(c.id)?'msg enter':''}" data-act="openConv" data-id="${c.id}" tabindex="0">${c.running?'<span class="run" title="在等你批准"></span>':''}<span class="t">${esc(c.title)}</span><button class="more" data-act="convMenu" data-id="${c.id}" aria-label="更多">${ic('more')}</button></div>`;
        for (const k of c.children) list += `<div class="conv child ${S.activeConv===k.id&&S.view==='chat'?'on':''}" data-act="openConv" data-id="${c.id}"><span class="t">↳ ${esc(k.title)}</span></div>`;
      }
    }
    if (!inSpace.length) list = `<div class="empty">这个工作区还没有对话</div>`;
  } else {
    list += `<div class="grp">蝶君的任务</div>`;
    for (const t of S.tasks) list += `<div class="conv ${S.view==='task'&&S.activeTask===t.id?'on':''} ${S.fresh.has(t.id)?'msg enter':''}" data-act="openTask" data-id="${t.id}" tabindex="0">${stChip(t.status,true)}<span class="t">${esc(t.title)}</span></div>`;
  }
  $('#side').innerHTML = `
    <div class="brand">${bf()}DreamFlutter<span style="font-size:13px;color:var(--muted);font-weight:500;margin-left:-4px">梦蝶</span></div>
    <div class="seg ${S.space==='dj'?'right':''}"><span class="knob"></span>
      <button class="${S.space==='wb'?'on':''}" data-act="space" data-v="wb">工作台</button>
      <button class="${S.space==='dj'?'on':''}" data-act="space" data-v="dj">蝶君${djBusy&&S.space!=='dj'?'<span class="dot" title="蝶君在忙"></span>':''}</button></div>
    <div class="nav">
      <button class="nav-i" data-act="new">${ic('plus')}${S.space==='wb'?'新对话':'交给蝶君一件事'}</button>
      <button class="nav-i ${S.view==='inbox'?'on':''}" data-act="view" data-v="inbox">${ic('inbox')}等你处理${nowCount()?`<span class="badge ${S.badgePop?'pop':''}">${nowCount()}</span>`:''}</button>
    </div>
    <label class="search">${ic('search')}<input id="q" placeholder="搜索对话、文件、记忆" value="${esc(S.query)}" aria-label="搜索"></label>
    <div class="list">${list}</div>
    <div class="side-foot">
      <button class="${S.view==='memory'?'on':''}" data-act="view" data-v="memory">${ic('memory')}记忆</button>
      <button class="${S.view==='skills'?'on':''}" data-act="view" data-v="skills">${ic('skills')}技能</button>
      <button class="${S.view==='cost'?'on':''}" data-act="view" data-v="cost">${ic('coin')}花费</button>
      <button class="${S.view==='settings'?'on':''}" data-act="view" data-v="settings">${ic('gear')}设置</button>
    </div>`;
  S.badgePop = false;
}

function stChip(s, dotOnly){
  const m = {run:['run','进行中'], wait:['wait','等你'], done:['ok','已完成'], fail:['bad','没做成']}[s];
  return dotOnly ? `<span class="st ${m[0]}" style="padding:0;background:none" title="${m[1]}"></span>` : `<span class="st ${m[0]}">${m[1]}</span>`;
}

function topBar(title, opts={}){
  const crumbs = S.space==='wb'
    ? `<span>工作台</span><span>/</span><button class="ws-btn" data-act="wsMenu">${ic('folder')}<span>${esc(S.ws)}</span>${ic('chev')}</button>${title?`<span>/</span><b>${esc(title)}</b>`:''}`
    : `<span>蝶君</span>${title?`<span>/</span><b>${esc(title)}</b>`:''}`;
  return `<div class="top"><button class="icon-btn" id="menuBtn" data-act="drawer" aria-label="打开侧栏">${ic('menu')}</button>
    <div class="crumb">${opts.page?`<b>${esc(opts.page)}</b>`:crumbs}</div><span class="sp"></span>
    ${opts.panel?`<button class="icon-btn ${S.right?'on':''}" data-act="togglePanel" title="${opts.panel}" aria-label="${opts.panel}">${ic('panel')}</button>`:''}</div>`;
}

function renderMain(){
  const m = $('#main');
  const changed = S.lastView !== S.view + S.space + S.activeConv + S.activeTask;
  let html = '';
  if (S.query.trim()) html = viewSearch();
  else if (S.view === 'chat') html = S.space==='wb' ? viewChat() : viewDjHome();
  else if (S.view === 'home') html = S.space==='wb' ? viewHome() : viewDjHome();
  else if (S.view === 'task') html = viewTask();
  else html = ({inbox:viewInbox, memory:viewMemory, skills:viewSkills, settings:viewSettings, cost:viewCost})[S.view]();
  const scroller = m.querySelector('.scroll'); const keep = !changed && scroller ? scroller.scrollTop : null;
  const hadFocus = document.activeElement && document.activeElement.id === 'box';
  const keepAv = {}; m.querySelectorAll('.presence[data-mid]').forEach(el => { const av = el.querySelector('.avatar'); if (av) keepAv[el.dataset.mid] = av; });
  m.innerHTML = html;
  m.querySelectorAll('.presence[data-mid]').forEach(el => { const old = keepAv[el.dataset.mid], nu = el.querySelector('.avatar'); if (old && nu && old.dataset.state === nu.dataset.state) nu.replaceWith(old); });
  const v = m.querySelector('.view'); if (changed && v){ v.classList.add('enter'); }
  S.lastView = S.view + S.space + S.activeConv + S.activeTask;
  const sc = m.querySelector('.scroll');
  if (sc){ if (keep !== null && !S.stick) sc.scrollTop = keep; else if (S.view==='chat'||S.view==='task') sc.scrollTop = sc.scrollHeight; }
  S.stick = false;
  const box = $('#box'); if (box){ box.value = S.draft; autosize(box); if (hadFocus) box.focus(); }
}

function composer(ph){
  return `<div class="composer-wrap"><div class="composer">
    ${S.quote?`<div class="qchip">${ic('right')}<span>${esc(S.quote.slice(0,120))}${S.quote.length>120?'…':''}</span><button class="x" data-act="clearQuote" aria-label="去掉引用">${ic('x')}</button></div>`:''}
    <textarea id="box" rows="1" placeholder="${ph}" aria-label="输入消息"></textarea>
    <div class="crow">
      <button class="icon-btn" title="添加文件（也可以直接拖进来）" data-act="attach">${ic('attach')}</button>
      ${S.space==='wb'?`<button class="chip ${S.ghost?'on':''}" data-act="ghost" title="这次不保存、不记忆">${ic('ghost')}无痕</button>`:''}
      <span class="sp"></span>
      <button class="chip" data-act="modelMenu">${esc(S.model)} ${ic('chev')}</button>
      <button class="chip" data-act="thinkMenu">思考 · ${S.think} ${ic('chev')}</button>
      ${S.busy?`<button class="send stop" data-act="stop" aria-label="停止">${ic('stop')}</button>`:`<button class="send" data-act="send" aria-label="发送" ${S.draft.trim()||S.quote?'':'disabled'}>${ic('send')}</button>`}
    </div></div></div>`;
}

function viewHome(){
  const g = ['让念头，开始飞翔','让想法，轻轻展开','今天也一起把事做完'][new Date().getMinutes()%3];
  return `<section class="view">${topBar('', {panel:null})}
    <div class="home">${sprite('idle')}<div class="greet">${g}</div><div class="quoteline">昔者庄周梦为胡蝶，栩栩然胡蝶也。<cite>《庄子·齐物论》</cite></div>
    <div class="examples">${['把 data/raw 里这周的数据整理成周报','帮我看看 src/mqtt.cpp 为什么不重连','把这篇论文的摘要翻成英文'].map(e=>`<button class="ex" data-act="example" data-v="${esc(e)}">${esc(e)}</button>`).join('')}</div></div>
    ${composer('说说要做什么，Enter 发送，Shift+Enter 换行')}</section>`;
}

function msgHTML(x, c){
  const fresh = S.fresh.has(x.id) ? ' enter' : '';
  if (x.r === 'user') return `<div class="msg u${fresh}"><div class="b">${x.quote?`<div class="quote">${esc(x.quote)}</div>`:''}${esc(x.text)}</div></div>`;
  if (x.r === 'ai'){
    const p = x.proc ? `<div class="proc ${x.proc.open?'open':''}"><button class="proc-h" data-act="toggleProc" data-id="${x.id}">${x.proc.running?'<span class="pulse"></span>':ic('check','ok')}<span>${x.proc.running?esc(x.proc.now):esc(x.proc.label)}</span>${x.proc.running&&x.proc.steps.length>1?`<span class="from">· 前面 ${x.proc.steps.length-1} 步</span>`:''}${ic('chev','chev')}</button>
      <div class="proc-b"><div>${x.proc.steps.map(s=>`<div class="step">${ic(s[0])}<span>${s[1]}</span></div>`).join('')}</div></div></div>` : '';
    const pres = x.proc && x.proc.running ? presence(x, S.space==='dj'?'蝶君':'工作台') : '';
    return `<div class="msg${fresh}">${pres}${p}${x.html?`<div class="reply ${x.streaming?'stream':''}">${x.html}</div>`:''}
      ${x.mem?`<div class="memnote" id="mn-${x.id}">${ic('memory')}已更新记忆：${esc(x.mem)} · <button data-act="view" data-v="memory">查看</button> · <button data-act="undoMem" data-id="${x.id}">撤销</button></div>`:''}
      ${x.meta?`<div class="ainfo"><button class="icon-btn" title="复制" data-act="copy">${ic('copy')}</button><button class="icon-btn" title="重新生成" data-act="regen">${ic('redo')}</button><button class="icon-btn" title="从这里重来（分出一个新对话）" data-act="forkHere">${ic('branch')}</button><button class="icon-btn" title="它参考了哪些记忆" data-act="usedMem">${ic('memory')}</button><span class="meta">${esc(x.meta)}</span></div>`:''}</div>`;
  }
  if (x.r === 'approve'){
    const st = x.state==='ok'?`<div class="state ok">${ic('check')}已允许</div>`:x.state==='no'?`<div class="state no">${ic('x')}已拒绝</div>`:
      `<div class="acts"><button class="btn pri" data-act="approve" data-id="${x.id}" data-v="ok">允许</button><button class="btn" data-act="approve" data-id="${x.id}" data-v="no">拒绝</button><button class="btn ghost" data-act="approve" data-id="${x.id}" data-v="all">这个对话里都允许这类操作</button></div>`;
    return `<div class="msg${fresh}"><div class="card approve"><h4>${ic('eye')}${esc(x.title)}</h4><div class="why">${esc(x.why)}</div>
      ${x.diff?`<div class="diff">${x.diff.map(l=>`<div class="${l[0]==='+'?'a':l[0]==='-'?'d':''}">${esc(l)}</div>`).join('')}</div>`:''}${st}</div></div>`;
  }
  if (x.r === 'error') return `<div class="msg${fresh}"><div class="card err"><h4 style="margin:0 0 4px;font-weight:500">这次没能完成</h4><div class="why">${esc(x.why)}</div><div class="acts" style="margin-top:10px"><button class="btn pri" data-act="retry">重试</button><button class="btn" data-act="modelMenu">换个模型</button><button class="btn ghost" data-act="goSet" data-v="模型">去设置</button></div></div></div>`;
  if (x.r === 'restate'){
    return `<div class="msg${fresh}"><div class="reply"><p>${esc(x.text)}</p><ol style="font-family:var(--sans);font-size:14px;margin:0 0 6px">${x.plan.map(p=>`<li>${esc(p)}</li>`).join('')}</ol></div>
      ${x.state==='wait'?`<div class="countdown"><i style="animation-duration:${x.secs}s"></i></div><div class="acts"><button class="btn pri" data-act="djStart" data-id="${x.id}">开始</button><button class="btn" data-act="djChange">改一下</button><span class="from">没回应的话 ${x.secs} 秒后按这个理解开始</span></div>`:`<div class="state ok">${ic('check')}已开始</div>`}</div>`;
  }
  if (x.r === 'deliver'){
    return `<div class="msg${fresh}"><div class="card deliver"><h4>交付：${esc(x.title)}</h4><div class="reply" style="font-size:14.5px"><p>${esc(x.summary)}</p></div>
      ${x.files.map(f=>`<div class="file">${ic('file')}<span class="n">${esc(f)}</span><button class="btn sm" data-act="toast" data-v="已用默认程序打开 ${esc(f)}">打开</button><button class="btn sm ghost" data-act="toast" data-v="已在资源管理器中显示">所在文件夹</button></div>`).join('')}
      <div class="from" style="margin-top:8px">用时 ${esc(x.time)} · 花费 ${esc(x.cost)}</div></div></div>`;
  }
  return '';
}

function viewChat(){
  const c = conv(S.activeConv);
  if (!c) return viewHome();
  const ch = c.children.find(k => k.id === S.activeConv);
  return `<section class="view">${topBar(ch ? ch.title : c.title, {panel:'本次改动'})}
    <div class="scroll"><div class="col">${c.msgs.map(x=>msgHTML(x,c)).join('')}</div></div>
    ${composer(S.ghost?'无痕：这次不保存、不记忆':'接着说，Enter 发送')}</section>`;
}

function viewDjHome(){
  const t = S.tasks;
  const rows = t.map(x => `<div class="row click ${S.fresh.has(x.id)?'enter':''}" data-act="openTask" data-id="${x.id}"><div class="main"><div class="ttl">${esc(x.title)}</div><div class="sub">${esc(x.progress)}</div>${x.status==='run'&&x.of?`<div class="prog"><i style="width:${Math.round(x.n/x.of*100)}%"></i></div>`:''}</div>${stChip(x.status)}</div>`).join('');
  return `<section class="view">${topBar('')}
    <div class="scroll"><div class="col">
      <div class="home" style="padding:12px 0 6px;flex:none">${sprite(S.tasks.some(t=>t.status==='run')?'working':'idle')}<div class="greet" style="font-size:30px">交给我吧，你去忙别的</div><div class="quoteline">云无心以出岫，鸟倦飞而知还。<cite>陶渊明《归去来兮辞》</cite></div>
      <div class="examples">${['每周一帮我整理上周的组会纪要','把这 30 篇文献统一成 GB/T 7714 格式','查一下三款温湿度传感器，列个对比表'].map(e=>`<button class="ex" data-act="example" data-v="${esc(e)}">${esc(e)}</button>`).join('')}</div></div>
      <div class="sec">正在做和最近做完的</div>${rows}
    </div></div>${composer('说说要交给蝶君什么事，可以拖文件进来')}</section>`;
}

function viewTask(){
  const t = task(S.activeTask);
  if (!t.msgs){
    t.msgs = [{id:nid('m'), r:'user', text:t.title}];
    if (t.status==='run') t.msgs.push({id:nid('m'), r:'ai', state:'working', t0:Date.now()-8*60000, proc:{running:true, now:t.progress, steps:[['file','读取 <code>参考文献.docx</code>，找到 30 条'],['play','逐条比对作者、题名、出处']]}, html:''});
    if (t.status==='wait') t.msgs.push({id:nid('m'), r:'ai', html:'<p>我找到了 7 款候选，规格都差不多，差别主要在价格。<b>预算上限是多少？</b>我按这个先筛一遍。</p>'});
    if (t.status==='done') t.msgs.push({id:nid('m'), r:'deliver', title:'10 月 27 日–11 月 2 日组会纪要', summary:'按模板整理了 3 次组会，共 11 个待办，其中 4 个已到期，已在文中标红。', files:['文档/组会/组会纪要-W44.md'], time:'6 分钟', cost:'¥0.05'});
    if (t.status==='fail') t.msgs.push({id:nid('m'), r:'error', why:'capture.pcapng 打不开，文件头不完整，可能是抓包中途被打断。重新抓一份，或者把能打开的那段导出成 csv 给我。'});
  }
  const waitAct = t.status==='wait' && t.inbox ? `<div class="msg"><div class="acts">${['200 元以内','500 元以内','不限'].map(a=>`<button class="btn" data-act="inboxAct" data-id="${t.inbox}" data-v="${a}">${a}</button>`).join('')}</div></div>` : '';
  return `<section class="view">${topBar(t.title, {panel:'任务进度'})}
    <div class="scroll"><div class="col">
      <div class="row" style="margin-bottom:20px"><div class="main"><div class="ttl">${esc(t.title)}</div><div class="sub">${esc(t.progress)}${t.repeat?` · 重复：${esc(t.repeat)}`:''}</div>${t.status==='run'&&t.of?`<div class="prog"><i style="width:${Math.round(t.n/t.of*100)}%"></i></div>`:''}</div>${stChip(t.status)}</div>
      ${t.msgs.map(x=>msgHTML(x)).join('')}${waitAct}
    </div></div>${composer(t.status==='done'?'不满意就接着说，它在原来的基础上改':'补充说明或者问问进度')}</section>`;
}

function viewInbox(){
  const now = S.inbox.filter(i => i.grp==='now'), later = S.inbox.filter(i => i.grp==='later');
  const row = i => `<div class="row ${S.fresh.has(i.id)?'enter':''}" id="row-${i.id}"><div class="main"><div class="from">${esc(i.from)}</div><div class="ttl">${esc(i.what)}</div><div class="sub">${esc(i.why)}</div>
    <div class="acts" style="margin-top:8px">${i.acts.map((a,n)=>`<button class="btn sm ${n===0?'pri':''}" data-act="inboxAct" data-id="${i.id}" data-v="${esc(a)}">${esc(a)}</button>`).join('')}<button class="btn sm ghost" data-act="inboxGo" data-id="${i.id}">去看看</button></div></div></div>`;
  return `<section class="view">${topBar('', {page:'等你处理'})}<div class="scroll"><div class="col">
    <div class="page-h"><span class="eyebrow">YOUR CALL</span><h1 class="art">这一笔等你点头</h1><p>等你处理 · 要你点头或做决定的事都在这里，点完就继续。</p></div>
    <div class="sec">现在需要你</div>${now.length?now.map(row).join(''):'<div class="empty">没有急着要你处理的事</div>'}
    <div class="sec">有空看看</div>${later.length?later.map(row).join(''):'<div class="empty">都处理完了</div>'}
  </div></div></section>`;
}

function memList(arr, key){
  return arr.map(k => `<div class="mem ${S.fresh.has(k.id)?'msg enter':''}" id="mem-${k.id}"><div style="flex:1;min-width:0"><div class="txt" contenteditable="true" spellcheck="false" data-mem="${k.id}" data-key="${key}">${esc(k.t)}</div>
    <div class="src">来自 <button data-act="memSrc">${esc(k.s)}</button> · ${esc(k.d)}</div></div>
    <div class="ops"><button class="icon-btn" title="改" data-act="memEdit" data-id="${k.id}">${ic('edit')}</button><button class="icon-btn" title="删" data-act="memDel" data-id="${k.id}" data-key="${key}">${ic('trash')}</button></div></div>`).join('') || '<div class="empty" style="padding:12px 0">还没有</div>';
}
function viewMemory(){
  const body = S.memTab==='all' ? `
    <div class="sec">关于你</div>${memList(S.memory.you,'you')}

/* ---------- behaviour ---------- */
function toast(text, undo){
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span>${esc(text)}</span>${undo?'<button>撤销</button>':''}`;
  $('#toasts').appendChild(el);
  let done = false;
  const close = () => { if (done) return; done = true; el.classList.add('out'); setTimeout(() => el.remove(), 260); };
  if (undo) el.querySelector('button').onclick = () => { undo(); close(); };
  setTimeout(close, undo ? 5000 : 2600);
}
function notify(from, text, go){
  const el = document.createElement('div'); el.className = 'notif'; el.setAttribute('role','status');
  el.innerHTML = `${bf()}<div><div class="from">${esc(from)}</div><div>${esc(text)}</div></div>`;
  document.body.appendChild(el);
  const close = () => { el.classList.add('out'); setTimeout(() => el.remove(), 260); };
  el.onclick = () => { close(); go && go(); };
  setTimeout(close, 5200);
}

}

    case 'theme': S.theme = v; if (v==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v); renderMain(); break;
    case 'closeTo': S.closeTo = v; renderMain(); break;
    case 'closeAsk': { const d = document.createElement('div'); d.className = 'notif'; d.style.cursor = 'default'; d.innerHTML = bf() + '<div><div class="from">关闭 DreamFlutter</div><div style="margin-bottom:8px">缩到托盘的话，蝶君的任务和定时任务会继续做。</div><div class="acts"><button class="btn sm pri" data-v="tray">缩到托盘</button><button class="btn sm" data-v="quit">退出</button></div><div class="from" style="margin-top:6px">会记住你的选择，设置里可以改</div></div>'; document.body.appendChild(d); d.querySelectorAll('button').forEach(x => x.onclick = ev => { ev.stopPropagation(); S.closeTo = x.dataset.v; d.remove(); renderMain(); toast(x.dataset.v==='tray' ? '已缩到托盘（演示）' : '已退出（演示）'); }); break; }
    case 'approval': S.approval = v; renderMain(); toast('审批：'+v); break;
    case 'djWait': S.djWait = v; renderMain(); break;
    case 'flip': b.classList.toggle('on'); break;
    case 'goSet': S.setTab = v; go('settings'); break;
    case 'retry': toast('已重试'); break;
    case 'regen': toast('会重新生成这条回复，旧的可以翻回去看'); break;
    case 'forkHere': toast('已从这里分出一个新对话，挂在原对话下面'); break;
    case 'copy': toast('已复制'); break;
    case 'djStart': djStart(S.activeTask, id); break;
    case 'djChange': { const t = task(S.activeTask); const rs = t.msgs.find(m=>m.r==='restate'&&m.state==='wait'); if (rs) clearTimeout(timers[rs.id]); $('#box').focus(); toast('倒计时停了，说说要改哪里'); break; }
    case 'wizard': wizard(); break;
    case 'wzTest': { const d = W.data; if (!d.key.trim()){ toast('先填密钥'); $('#wzKey').focus(); return; } d.testing = true; renderWiz(); setTimeout(()=>{ d.testing=false; d.tested=true; renderWiz(); }, 1200); break; }
    case 'guide': S.guideMin = !S.guideMin; renderGuide(); break;
    case 'drawer': S.drawer = !S.drawer; $('#app').classList.toggle('drawer', S.drawer); break;
    case 'closeDrawer': S.drawer = false; $('#app').classList.remove('drawer'); break;
    case 'toast': toast(v); break;
    case 'asideBack': { const last = [...S.aside.msgs].reverse().find(m=>m.r==='ai'&&m.t!=='…'); S.quote = last ? last.t : S.aside.q; S.right = null; renderRight(); renderMain(); $('#box').focus(); break; }
    case 'asideSave': { const c = conv(S.activeConv); const k = {id:nid('c'), title:'问一下：'+S.aside.q.slice(0,12)+'…'}; c.children.push(k); S.fresh.add(k.id); renderSide(); toast('已存下来，挂在这个对话下面'); break; }
    case 'quoteSel': S.quote = selText; hideSel(); renderMain(); $('#box').focus(); break;
    case 'askSel': S.aside = {q:selText, msgs:[]}; hideSel(); S.right = 'aside'; renderRight(); renderMain(); setTimeout(()=>$('#abox')&&$('#abox').focus(), 380); break;
  }
});

function newConvFrom(text){
  const c = {id:nid('c'), ws:S.ws, title:text.length>18?text.slice(0,18)+'…':text, when:'今天', msgs:[], changes:[], products:[], children:[]};
  S.convs.unshift(c); S.fresh.add(c.id); S.activeConv = c.id; S.view = 'chat';
  wbReply(text, null);
}
function send(){
  const text = (S.draft || '').trim(); if (!text && !S.quote) return; if (S.busy) return;
  if (S.space === 'dj'){
    if (S.view === 'task'){ const t = task(S.activeTask); const u = {id:nid('m'), r:'user', text}; t.msgs.push(u); S.fresh.add(u.id); S.draft=''; S.stick=true; render();
      const rs = t.msgs.find(m=>m.r==='restate'&&m.state==='wait');
      setTimeout(()=>{ const r = {id:nid('m'), r:'ai', html:`<p>${rs?'好，按你说的改了，现在开始。':'收到，我在原来的基础上改，改好了通知你。'}</p>`}; t.msgs.push(r); S.fresh.add(r.id); S.stick=true; render(); if (rs) djStart(t.id, rs.id); }, 800); return; }
    djAssign(text); return;
  }
  if (!S.activeConv || S.view === 'home'){ S.draft=''; newConvFrom(text); return; }
  wbReply(text || '（引用）', S.quote);
}
document.addEventListener('input', e => {
  if (e.target.id === 'box'){ S.draft = e.target.value; autosize(e.target); const s = document.querySelector('.send:not(.stop)'); if (s) s.disabled = !S.draft.trim() && !S.quote; }
  if (e.target.id === 'q'){ S.query = e.target.value; renderMain(); renderRight(); }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'box' && e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
  if (e.target.id === 'abox' && e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); const t = e.target.value.trim(); if (!t) return; S.aside.msgs.push({r:'user',t},{r:'ai',t:'…'}); renderRight(); setTimeout(()=>{ S.aside.msgs[S.aside.msgs.length-1].t = '露点是空气在水汽含量不变时降温到饱和的温度。常用 Magnus 近似：先算 γ = ln(RH/100) + 17.62·T/(243.12+T)，露点 Td = 243.12·γ/(17.62−γ)。'; renderRight(); }, 900); }
  if (e.key === 'Escape'){ closePop(); hideSel(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('conv')){ e.preventDefault(); e.target.click(); }
  if (e.target.dataset && e.target.dataset.mem && e.key === 'Enter'){ e.preventDefault(); e.target.blur(); }
});
document.addEventListener('focusout', e => {
  const t = e.target; if (!t.dataset || !t.dataset.mem) return;
  const arr = S.memory[t.dataset.key]; const k = arr.find(x=>x.id===t.dataset.mem); const nv = t.textContent.trim();
  if (k && nv && nv !== k.t){ const old = k.t; k.t = nv; k.d = '刚刚'; toast('已保存', ()=>{ k.t = old; renderMain(); }); }
});
/* selection → 引用 / 问一下 */
let selText = '';
function hideSel(){ const p = $('#selpop'); if (p) p.remove(); }
document.addEventListener('mouseup', e => {
  if (e.target.closest('#selpop')) return;
  setTimeout(() => {
    const s = document.getSelection(); const t = s ? s.toString().trim() : '';
    if (!t || !s.anchorNode || !s.anchorNode.parentElement || !s.anchorNode.parentElement.closest('.reply')) { hideSel(); return; }
    selText = t; hideSel();
    const r = s.getRangeAt(0).getBoundingClientRect();
    const el = document.createElement('div'); el.className = 'pop selpop'; el.id = 'selpop';
    el.innerHTML = `<button data-act="quoteSel">${ic('right')}引用</button><button data-act="askSel">${ic('search')}问一下</button>`;
    document.body.appendChild(el);
    el.style.left = Math.max(8, Math.min(r.left + r.width/2 - el.offsetWidth/2, innerWidth - el.offsetWidth - 8)) + 'px';
    el.style.top = Math.max(8, r.top - el.offsetHeight - 8) + 'px';
  }, 10);
});

render();
try { if (!localStorage.getItem('df-proto-seen')){ localStorage.setItem('df-proto-seen','1'); } } catch(_){}
</script>
