name: dreamflutter
description: "Personal AI agent desktop app on the Pi runtime"
publish_to: 'none'
version: 0.8.3+14

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  pi_rpc:
    path: ../packages/pi_rpc
  file_selector: ^1.1.0
  flutter_markdown_plus: ^1.0.12
  path: ^1.9.1
  shared_preferences: ^2.5.6
  shared_preferences_platform_interface: ^2.4.2
  url_launcher: ^6.3.3
  window_manager: ^0.5.2
  tray_manager: ^0.5.0
  local_notifier: ^0.1.6
  highlight: ^0.7.0
  markdown: ^7.3.1
  desktop_drop: ^0.8.4
  pasteboard: ^0.6.0
  flutter_math_fork: ^0.7.4
  webview_windows: ^0.4.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.ico
    - assets/fonts/OFL-MaShanZheng.txt
  fonts:
    - family: Ma Shan Zheng
      fonts:
        - asset: assets/fonts/MaShanZheng-Regular.ttf

dependency_overrides:
  # Vendored with a Windows change: images dragged out of browsers and chat apps
  # (virtual files, bitmaps) arrive as files too. See packages/desktop_drop/pubspec.yaml.
  desktop_drop:
    path: ../packages/desktop_drop
